<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kdy můžu domů?</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c1726">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Domů?">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#1c1726;
    --panel:#251d33;
    --line:#3a2f4d;
    --ink:#efe9df;
    --muted:#9a8fae;
    --amber:#ffb020;
    --amber-dim:#7a5410;
    --glow:rgba(255,176,32,.28);
    --red:#ff5c6c;
    --green:#43c67d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    background:
      radial-gradient(120% 80% at 50% -10%, #2a2138 0%, var(--bg) 60%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    overflow-y:auto;
    padding:calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
  }
  .card{
    width:100%;
    max-width:460px;
    margin:auto;
    position:relative;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:20px;
    padding:34px 30px 30px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.6);
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--amber);
    font-weight:600;
    margin-bottom:6px;
    text-align:center;
  }
  h1{
    font-size:26px;
    font-weight:700;
    letter-spacing:-.01em;
    margin-bottom:26px;
    text-align:center;
  }
  label{
    display:block;
    font-size:13px;
    color:var(--muted);
    margin-bottom:9px;
    letter-spacing:.02em;
  }
  .field{margin-bottom:22px}
  input[type="time"]{
    width:100%;
    background:#161020;
    border:1px solid var(--line);
    border-radius:12px;
    color:var(--ink);
    font-size:22px;
    font-family:"SFMono-Regular","Consolas",monospace;
    padding:14px 16px;
    letter-spacing:.06em;
  }
  input[type="time"]:focus,
  .seg button:focus-visible,
  input[type="time"]:focus-visible{
    outline:2px solid var(--amber);
    outline-offset:2px;
  }
  input[type="time"]::-webkit-calendar-picker-indicator{filter:invert(.7)}

  .seg-group{display:flex;flex-direction:column;gap:14px}
  .seg-cap{
    display:block;
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:7px;
  }
  .seg{display:flex;gap:10px}
  .seg button{
    flex:1;
    background:#161020;
    border:1px solid var(--line);
    border-radius:12px;
    color:var(--muted);
    font-size:16px;
    font-weight:600;
    padding:15px 0;
    cursor:pointer;
    transition:border-color .15s, color .15s, background .15s;
  }
  .seg button:hover{border-color:#5a4a76}
  .seg button.active{
    background:var(--amber);
    border-color:var(--amber);
    color:#1c1726;
  }
  .seg button .h{display:block;font-size:19px;line-height:1}
  .seg button .t{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:4px;opacity:.75}

  .row{display:flex;gap:14px;align-items:flex-end}
  .row .field{flex:1;margin-bottom:0}

  .check{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:16px;
    cursor:pointer;
    user-select:none;
    font-size:14px;
    color:var(--ink);
  }
  .check input{position:absolute;opacity:0;width:0;height:0}
  .box{
    width:44px;
    height:26px;
    border-radius:999px;
    background:#161020;
    border:1px solid var(--line);
    position:relative;
    flex:none;
    transition:background .15s,border-color .15s;
  }
  .box::after{
    content:"";
    position:absolute;
    top:3px;left:3px;
    width:18px;height:18px;
    border-radius:50%;
    background:var(--muted);
    transition:transform .15s,background .15s;
  }
  .check input:checked + .box{background:var(--amber);border-color:var(--amber)}
  .check input:checked + .box::after{transform:translateX(18px);background:#1c1726}
  .check input:focus-visible + .box{outline:2px solid var(--amber);outline-offset:2px}
  .check .state{color:var(--muted);font-size:13px}

  .display{
    margin-top:26px;
    background:#120d1c;
    border:1px solid var(--line);
    border-radius:16px;
    padding:26px 20px 22px;
    text-align:center;
  }
  .display .lbl{
    font-size:12px;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:10px;
  }
  .clock{
    font-family:"SFMono-Regular","Consolas",monospace;
    font-size:64px;
    font-weight:700;
    letter-spacing:.05em;
    color:var(--amber);
    text-shadow:0 0 22px var(--glow);
    line-height:1;
  }
  .breakdown{
    margin-top:18px;
    font-size:13px;
    color:var(--muted);
    line-height:1.7;
  }
  .breakdown b{color:var(--ink);font-weight:600}

  .now-lbl{
    margin-top:16px;
    padding-top:16px;
    border-top:1px solid var(--line);
    font-size:12px;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--muted);
    text-align:center;
    margin-bottom:8px;
    min-height:15px;
  }
  .now{
    text-align:center;
    font-family:"SFMono-Regular","Consolas",monospace;
    font-weight:700;
    font-size:28px;
    letter-spacing:.05em;
    min-height:34px;
  }
  .now.over{ color:var(--green); }
  .now.left{ color:var(--red); }

  /* akční tlačítka pod výsledkem */
  .actions{ display:flex; gap:10px; margin-top:2px; }
  .act-btn{
    flex:1;
    padding:11px 10px;
    border-radius:12px;
    border:1px solid var(--line);
    background:#161020;
    color:var(--ink);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .act-btn:active{ border-color:#5a4a76; }
  .act-btn.primary{ background:var(--amber); border-color:var(--amber); color:#1c1726; }
  .act-btn.danger{ color:var(--red); }

  /* panel Historie */
  .sheet{
    position:fixed; inset:0; z-index:10;
    background:rgba(12,9,18,.72);
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
    display:flex; align-items:flex-end; justify-content:center;
  }
  .sheet[hidden]{ display:none; }
  .sheet-inner{
    width:100%; max-width:460px; max-height:86dvh; overflow-y:auto;
    background:var(--panel); border:1px solid var(--line);
    border-radius:20px 20px 0 0;
    padding:20px 20px calc(env(safe-area-inset-bottom) + 20px);
  }
  .sheet-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .sheet-head h2{ font-size:18px; font-weight:700; }
  .sheet-close{ background:transparent; border:none; color:var(--muted); font-size:18px; cursor:pointer; padding:4px 8px; }
  .totals{ display:flex; gap:10px; margin-bottom:14px; }
  .tot{ flex:1; background:#161020; border:1px solid var(--line); border-radius:12px; padding:12px; text-align:center; }
  .tot .k{ font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .tot .v{ font-family:"SFMono-Regular","Consolas",monospace; font-size:20px; font-weight:700; margin-top:4px; }
  .log{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .log-empty{ color:var(--muted); font-size:14px; text-align:center; padding:16px 0; }
  .rec{ display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:#161020; border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .rec .d{ font-size:13px; color:var(--ink); font-weight:600; }
  .rec .t{ font-size:12px; color:var(--muted); margin-top:2px; }
  .rec .df{ font-family:"SFMono-Regular","Consolas",monospace; font-weight:700; font-size:15px; }
  .df.pos{ color:var(--green); } .df.neg{ color:var(--red); } .df.zero{ color:var(--muted); }
  .rec-del{ background:transparent; border:none; color:var(--muted); cursor:pointer; font-size:14px; padding:2px 6px; }
  .sheet-actions{ display:flex; gap:10px; }

  .toast{
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 24px);
    transform:translateX(-50%); z-index:20;
    background:#161020; border:1px solid var(--line); border-radius:999px;
    color:var(--ink); font-size:14px; font-weight:600; padding:10px 18px;
    box-shadow:0 12px 30px -10px rgba(0,0,0,.6); max-width:90vw; text-align:center;
  }
  .toast[hidden]{ display:none; }
  .foot{
    margin-top:18px;
    font-size:12px;
    color:var(--muted);
    text-align:center;
  }
  @media (prefers-reduced-motion:no-preference){
    .clock{transition:opacity .2s}
  }

  .corner-btn{
    position:absolute;
    top:calc(env(safe-area-inset-top) + 12px);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    line-height:0;
    color:var(--muted);
    padding:8px;
    border-radius:12px;
    border:1px solid var(--line);
    background:rgba(22,15,32,.55);
    -webkit-backdrop-filter:blur(4px);
    backdrop-filter:blur(4px);
    cursor:pointer;
    z-index:2;
  }
  .corner-btn:active{color:var(--amber);border-color:#5a4a76}
  .corner-btn:disabled{opacity:.35;cursor:default}
  .corner-btn:disabled:active{color:var(--muted);border-color:var(--line)}
  .share-btn{right:calc(env(safe-area-inset-right) + 14px)}
  .cal-btn{left:calc(env(safe-area-inset-left) + 14px)}

  .start-row{
    display:flex;
    gap:10px;
    align-items:stretch;
  }
  .start-row input[type="time"]{
    flex:1;
    min-width:0;
  }
  .now-btn{
    flex:0 0 auto;
    padding:0 24px;
    border:none;
    border-radius:12px;
    background:var(--amber);
    color:#1c1726;
    font-size:16px;
    font-weight:700;
    letter-spacing:.02em;
    cursor:pointer;
  }
  .now-btn:active{filter:brightness(.93)}

  /* --- Mobil: celá obrazovka bez scrollování --- */
  @media (max-width:520px){
    body{
      padding:0;
      align-items:stretch;
      overflow:hidden;               /* obsah se vejde, scroll netřeba */
    }
    .card{
      max-width:none;
      margin:0;
      min-height:100dvh;
      border:none;
      border-radius:0;
      box-shadow:none;
      display:flex;
      flex-direction:column;
      justify-content:center;        /* vycentruj do plné výšky */
      gap:clamp(10px,2.2vh,20px);
      padding:calc(env(safe-area-inset-top) + 16px)
              calc(env(safe-area-inset-right) + 22px)
              calc(env(safe-area-inset-bottom) + 16px)
              calc(env(safe-area-inset-left) + 22px);
    }
    /* zruš pevné spodní mezery – rozestupy řeší gap na kartě */
    h1{margin-bottom:0;font-size:clamp(20px,5.5vw,26px)}
    .field{margin-bottom:0}
    .seg-group{gap:clamp(8px,1.6vh,14px)}
    input[type="time"]{padding:clamp(9px,1.4vh,14px) 16px;font-size:20px}
    .seg button{padding:clamp(10px,1.6vh,15px) 0}
    .check{margin-top:clamp(8px,1.4vh,16px)}
    .display{margin-top:0;padding:clamp(14px,2.4vh,26px) 20px}
    .clock{font-size:clamp(40px,13vw,64px)}
    .now-lbl{margin-top:clamp(10px,1.6vh,16px);padding-top:clamp(10px,1.6vh,16px)}
    .now{font-size:clamp(22px,7vw,28px)}
  }
</style>
</head>
<body>
  <main class="card">
    <button class="corner-btn cal-btn" id="calBtn" type="button"
            aria-label="Přidat připomínku do kalendáře" title="Připomínka v kalendáři">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M7 2h2v2h6V2h2v2h1a2 2 0 0 1 2 2v2H4V6a2 2 0 0 1 2-2h1V2z"/>
        <path d="M4 10h16v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-9zm3 3v2h2v-2H7zm4 0v2h2v-2h-2zm4 0v2h2v-2h-2z"/>
      </svg>
    </button>

    <a class="corner-btn share-btn" href="sdilet.html" aria-label="Sdílet appku (QR kód)" title="Sdílet · QR">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M3 3h7v7H3V3zm2 2v3h3V5H5z"/>
        <path d="M14 3h7v7h-7V3zm2 2v3h3V5h-3z"/>
        <path d="M3 14h7v7H3v-7zm2 2v3h3v-3H5z"/>
        <path d="M14 14h2v2h-2zM18 14h3v2h-3zM16 16h2v2h-2zM14 18h2v3h-2zM18 18h3v3h-3z"/>
      </svg>
    </a>

    <h1>Kdy můžu domů?</h1>

    <div class="field">
      <label for="start">Začátek směny</label>
      <div class="start-row">
        <input type="time" id="start">
        <button type="button" class="now-btn" id="nowBtn">Teď</button>
      </div>
    </div>

    <div class="field">
      <label>Pracovní doba</label>
      <div class="seg-group" id="seg" role="group" aria-label="Pracovní doba">
        <div class="seg-block">
          <span class="seg-cap">Zkrácená</span>
          <div class="seg">
            <button type="button" data-min="360"><span class="h">6</span><span class="t">hodin</span></button>
          </div>
        </div>
        <div class="seg-block">
          <span class="seg-cap">Klasická</span>
          <div class="seg">
            <button type="button" data-min="480"><span class="h">8</span><span class="t">ranní</span></button>
            <button type="button" data-min="450"><span class="h">7:30</span><span class="t">odpolední</span></button>
            <button type="button" data-min="420"><span class="h">7:00</span><span class="t">noční</span></button>
          </div>
        </div>
      </div>
    </div>

    <div class="field">
      <label for="brk">Svačina</label>
      <input type="time" id="brk" value="00:30">
      <label class="check" for="paid">
        <input type="checkbox" id="paid">
        <span class="box"></span>
        <span>Placená pauza <span class="state" id="paidState">(neplacená → přičítá se)</span></span>
      </label>
    </div>

    <div class="display">
      <div class="lbl">Odchod domů</div>
      <div class="clock" id="result" aria-live="polite">–:–</div>
      <div class="breakdown" id="breakdown"></div>
      <div class="now-lbl" id="nowLbl"></div>
      <div class="now" id="now"></div>
    </div>

    <div class="actions">
      <button type="button" class="act-btn primary" id="leaveBtn">Zapsat odchod</button>
      <button type="button" class="act-btn" id="histBtn">Historie</button>
    </div>
  </main>

  <div class="sheet" id="history" hidden>
    <div class="sheet-inner">
      <div class="sheet-head">
        <h2>Historie</h2>
        <button type="button" class="sheet-close" id="histClose" aria-label="Zavřít">✕</button>
      </div>
      <div class="totals" id="totals"></div>
      <div class="log" id="logList"></div>
      <div class="sheet-actions">
        <button type="button" class="act-btn" id="csvBtn">Export CSV</button>
        <button type="button" class="act-btn danger" id="clearBtn">Vymazat vše</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

<script>
  const startEl = document.getElementById('start');
  const segEl   = document.getElementById('seg');
  const brkInput= document.getElementById('brk');
  const paidEl  = document.getElementById('paid');
  const paidTxt = document.getElementById('paidState');
  const resEl   = document.getElementById('result');
  const brkEl   = document.getElementById('breakdown');
  const nowEl   = document.getElementById('now');
  const nowLbl  = document.getElementById('nowLbl');
  const nowBtn  = document.getElementById('nowBtn');
  const calBtn  = document.getElementById('calBtn');
  let workMin = 480;   // ← výchozí doba v minutách (360=6h, 420=7:00, 450=7:30, 480=8h)
  let startTotal = null;  // začátek v minutách od půlnoci
  let endTotal   = null;  // odchod v minutách od půlnoci (může přesáhnout 1440)

  function pad(n){ return String(n).padStart(2,'0'); }

  function syncSeg(){
    segEl.querySelectorAll('button').forEach(b =>
      b.classList.toggle('active', Number(b.dataset.min) === workMin));
  }

  function breakMinutes(){
    const v = brkInput.value;
    if(!v) return 0;
    const [h, m] = v.split(':').map(Number);
    return h*60 + m;
  }

  function calc(){
    const v = startEl.value;
    if(!v){
      resEl.textContent = '–:–';
      brkEl.textContent = '';
      nowEl.textContent = '';
      startTotal = endTotal = null;
      if(calBtn) calBtn.disabled = true;
      return;
    }

    const [sh, sm] = v.split(':').map(Number);
    const brk  = breakMinutes();
    const paid = paidEl.checked;
    // placená pauza se počítá jako práce → do odchodu se nepřičítá
    const addBreak = paid ? 0 : brk;

    startTotal = sh*60 + sm;
    const total = startTotal + workMin + addBreak;   // minuty od půlnoci
    endTotal = total;
    const endMin = ((total % 1440) + 1440) % 1440;    // ošetření přes půlnoc
    const eh = Math.floor(endMin / 60);
    const em = endMin % 60;

    const workLbl = pad(Math.floor(workMin/60)) + ':' + pad(workMin%60);
    paidTxt.textContent = paid ? '(placená → nepřičítá se)' : '(neplacená → přičítá se)';

    resEl.textContent = pad(eh) + ':' + pad(em);
    brkEl.innerHTML =
      'Začátek <b>' + pad(sh) + ':' + pad(sm) + '</b> + '
      + '<b>' + workLbl + '</b> práce'
      + (paid
          ? ' <span style="opacity:.6">(pauza ' + pad(Math.floor(brk/60)) + ':' + pad(brk%60) + ' placená)</span>'
          : ' + <b>' + pad(Math.floor(brk/60)) + ':' + pad(brk%60) + '</b> pauza')
      + (total >= 1440 ? ' <b>(další den)</b>' : '');

    if(calBtn) calBtn.disabled = false;
    updateNow();
  }

  function updateNow(){
    if(endTotal === null){
      nowEl.textContent = ''; nowEl.className = 'now';
      nowLbl.textContent = '';
      return;
    }

    const d = new Date();
    let nowMin = d.getHours()*60 + d.getMinutes();
    // pokud odchod přetéká přes půlnoc a je zrovna po půlnoci, posuň "teď" na další den
    if(endTotal >= 1440 && nowMin < startTotal) nowMin += 1440;

    const diff = nowMin - endTotal;          // >0 přesčas, <0 zbývá
    const abs  = Math.abs(diff);
    const hhmm = pad(Math.floor(abs/60)) + ':' + pad(abs%60);

    if(diff < 0){                            // ještě pracuješ → zbývá, červeně
      nowLbl.textContent = 'Zbývá';
      nowEl.className = 'now left';
      nowEl.textContent = '-' + hhmm;
    } else {                                 // odchod nebo přesčas → zeleně
      nowLbl.textContent = 'Přesčas';
      nowEl.className = 'now over';
      nowEl.textContent = '+' + hhmm;
    }
  }

  segEl.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if(!btn) return;
    workMin = Number(btn.dataset.min);
    syncSeg();
    saveSettings();
    calc();
  });

  // --- uložení startu na 9 h ---
  const STORE_KEY = 'kdyDomu.start';
  const DAY_MS = 9 * 60 * 60 * 1000;

  function saveStart(){
    try{
      if(startEl.value){
        localStorage.setItem(STORE_KEY, JSON.stringify({ time: startEl.value, ts: Date.now() }));
      } else {
        localStorage.removeItem(STORE_KEY);
      }
    }catch(e){}
  }

  function nowHHMM(){
    const d = new Date();
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function loadStart(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(raw){
        const { time, ts } = JSON.parse(raw);
        if(time && (Date.now() - ts) < DAY_MS){
          startEl.value = time;               // mladší 9 h → předvyplnit uložený
          return;
        }
        localStorage.removeItem(STORE_KEY);   // starší → zahodit
      }
    }catch(e){}
    // není platný uložený start → předvyplň aktuální čas a ulož
    startEl.value = nowHHMM();
    saveStart();
  }

  // --- uložení pracovní doby a svačiny (trvalá předvolba) ---
  const SET_KEY = 'kdyDomu.settings';
  const WORK_OK = [360, 420, 450, 480];

  function saveSettings(){
    try{
      localStorage.setItem(SET_KEY, JSON.stringify({
        workMin: workMin,
        brk: brkInput.value,
        paid: paidEl.checked
      }));
    }catch(e){}
  }

  function loadSettings(){
    try{
      const raw = localStorage.getItem(SET_KEY);
      if(!raw) return;
      const s = JSON.parse(raw);
      if(WORK_OK.includes(s.workMin)) workMin = s.workMin;
      if(typeof s.brk === 'string' && /^\d{1,2}:\d{2}$/.test(s.brk)) brkInput.value = s.brk;
      if(typeof s.paid === 'boolean') paidEl.checked = s.paid;
    }catch(e){}
  }

  // --- tlačítko "Teď": nastaví aktuální čas jako začátek ---
  nowBtn.addEventListener('click', () => {
    startEl.value = nowHHMM();
    saveStart();
    calc();
  });

  // --- připomínka do kalendáře (.ics) ---
  function icsLocal(dt){
    return dt.getFullYear() + pad(dt.getMonth()+1) + pad(dt.getDate())
      + 'T' + pad(dt.getHours()) + pad(dt.getMinutes()) + '00';
  }
  function icsUTC(dt){
    return dt.getUTCFullYear() + pad(dt.getUTCMonth()+1) + pad(dt.getUTCDate())
      + 'T' + pad(dt.getUTCHours()) + pad(dt.getUTCMinutes()) + pad(dt.getUTCSeconds()) + 'Z';
  }

  // stálé ID události + verze (SEQUENCE) → kalendář událost přepíše místo duplikace
  function eventMeta(){
    let meta = null;
    try{ meta = JSON.parse(localStorage.getItem('kdyDomu.evt') || 'null'); }catch(e){}
    if(!meta || !meta.uid){
      meta = { uid: 'kdydomu-' + Date.now() + '-' + Math.random().toString(36).slice(2,8) + '@drumclock.github.io', seq: 0 };
    } else {
      meta.seq = (meta.seq | 0) + 1;   // každý další export = vyšší verze
    }
    try{ localStorage.setItem('kdyDomu.evt', JSON.stringify(meta)); }catch(e){}
    return meta;
  }

  function buildICS(){
    // odchod jako reálné datum: dnešní půlnoc + endTotal minut (přeteče na další den samo)
    const base = new Date();
    const dep = new Date(base.getFullYear(), base.getMonth(), base.getDate(), 0, 0, 0, 0);
    dep.setMinutes(endTotal);
    const end = new Date(dep.getTime() + 15 * 60000);
    const meta = eventMeta();

    return [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//Kdy domu//CS',
      'CALSCALE:GREGORIAN',
      'METHOD:PUBLISH',
      'BEGIN:VEVENT',
      'UID:' + meta.uid,
      'SEQUENCE:' + meta.seq,
      'DTSTAMP:' + icsUTC(new Date()),
      'DTSTART:' + icsLocal(dep),
      'DTEND:' + icsLocal(end),
      'SUMMARY:Odchod domů 🏠',
      'DESCRIPTION:Konec směny – můžeš jít domů.',
      'BEGIN:VALARM',
      'ACTION:DISPLAY',
      'DESCRIPTION:Odchod domů',
      'TRIGGER;RELATED=START:PT0S',
      'END:VALARM',
      'END:VEVENT',
      'END:VCALENDAR'
    ].join('\r\n');
  }

  calBtn.addEventListener('click', () => {
    if(endTotal === null) return;
    const blob = new Blob([buildICS()], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'odchod-domu.ics';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  });

  // ===== Evidence přesčasů / dřívějších odchodů =====
  const LOG_KEY = 'kdyDomu.log';
  const leaveBtn = document.getElementById('leaveBtn');
  const histBtn  = document.getElementById('histBtn');
  const histEl   = document.getElementById('history');
  const histClose= document.getElementById('histClose');
  const totalsEl = document.getElementById('totals');
  const logListEl= document.getElementById('logList');
  const csvBtn   = document.getElementById('csvBtn');
  const clearBtn = document.getElementById('clearBtn');
  const toastEl  = document.getElementById('toast');

  function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  function fmtDiff(min){ const a=Math.abs(min); return (min<0?'-':'+') + Math.floor(a/60) + ':' + pad(a%60); }
  function diffClass(v){ return v>0 ? 'pos' : (v<0 ? 'neg' : 'zero'); }
  function startOfWeek(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; }

  function loadLog(){ try{ return JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); }catch(e){ return []; } }
  function saveLog(a){ try{ localStorage.setItem(LOG_KEY, JSON.stringify(a)); }catch(e){} }

  let toastTimer;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.hidden = true; }, 2600);
  }

  function recordDeparture(){
    if(endTotal === null || !startEl.value){ toast('Nejdřív zadej začátek směny'); return; }
    const base = new Date();
    const planned = new Date(base.getFullYear(), base.getMonth(), base.getDate(), 0, 0, 0, 0);
    planned.setMinutes(endTotal);
    const now = new Date();
    let diff = Math.round((now.getTime() - planned.getTime()) / 60000);
    diff = ((diff % 1440) + 1440) % 1440;          // nejbližší rozdíl v rámci ±12 h
    if(diff > 720) diff -= 1440;
    const endMin = ((endTotal % 1440) + 1440) % 1440;

    const rec = {
      date: ymd(now),
      start: startEl.value,
      planned: pad(Math.floor(endMin/60)) + ':' + pad(endMin%60),
      actual: pad(now.getHours()) + ':' + pad(now.getMinutes()),
      diff: diff
    };
    const log = loadLog().filter(r => r.date !== rec.date);  // jeden záznam na den (poslední platí)
    log.push(rec);
    log.sort((a,b) => a.date < b.date ? 1 : -1);            // nejnovější nahoře
    saveLog(log);
    toast((diff >= 0 ? 'Přesčas ' : 'Dřívější odchod ') + fmtDiff(diff) + ' zapsáno');
    renderHistory();
  }

  function renderHistory(){
    const log = loadLog();
    const now = new Date();
    const wk = startOfWeek(now).getTime();
    let wSum = 0, mSum = 0;
    log.forEach(r => {
      const d = new Date(r.date + 'T00:00:00');
      if(d.getTime() >= wk && d.getTime() < wk + 7*86400000) wSum += r.diff;
      if(d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth()) mSum += r.diff;
    });
    totalsEl.innerHTML =
      '<div class="tot"><div class="k">Tento týden</div><div class="v ' + diffClass(wSum) + '">' + fmtDiff(wSum) + '</div></div>' +
      '<div class="tot"><div class="k">Tento měsíc</div><div class="v ' + diffClass(mSum) + '">' + fmtDiff(mSum) + '</div></div>';

    if(!log.length){ logListEl.innerHTML = '<div class="log-empty">Zatím žádné záznamy.</div>'; return; }
    logListEl.innerHTML = log.map(r => {
      const dd = r.date.slice(8,10) + '.' + r.date.slice(5,7) + '.';
      return '<div class="rec"><div><div class="d">' + dd + '</div>' +
             '<div class="t">' + r.start + ' → ' + r.actual + ' (plán ' + r.planned + ')</div></div>' +
             '<div style="display:flex;align-items:center;gap:6px">' +
             '<span class="df ' + diffClass(r.diff) + '">' + fmtDiff(r.diff) + '</span>' +
             '<button class="rec-del" data-date="' + r.date + '" aria-label="Smazat">✕</button></div></div>';
    }).join('');
  }

  function exportCSV(){
    const log = loadLog().slice().sort((a,b) => a.date < b.date ? -1 : 1);
    if(!log.length){ toast('Žádné záznamy k exportu'); return; }
    const head = ['Datum','Zacatek','Plan','Skutecnost','Rozdil_min','Rozdil'];
    const rows = log.map(r => [r.date, r.start, r.planned, r.actual, r.diff, fmtDiff(r.diff)]);
    const csv = '\uFEFF' + [head].concat(rows).map(r => r.join(';')).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'prescasy.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  leaveBtn.addEventListener('click', recordDeparture);
  histBtn.addEventListener('click', () => { renderHistory(); histEl.hidden = false; });
  histClose.addEventListener('click', () => { histEl.hidden = true; });
  histEl.addEventListener('click', e => { if(e.target === histEl) histEl.hidden = true; });
  csvBtn.addEventListener('click', exportCSV);
  clearBtn.addEventListener('click', () => { if(confirm('Opravdu vymazat všechny záznamy?')){ saveLog([]); renderHistory(); } });
  logListEl.addEventListener('click', e => {
    const b = e.target.closest('.rec-del'); if(!b) return;
    saveLog(loadLog().filter(r => r.date !== b.dataset.date));
    renderHistory();
  });

  // ===== parametry v URL (pro NFC tag) =====
  // ?now  → aktuální čas jako začátek
  // ?start=HH:MM → konkrétní čas
  // ?odchod → zapíše odchod (přesčas / dřívější)
  function applyStartParams(params){
    if(params.has('start')){
      const [h, m] = (params.get('start') || '').split(':').map(Number);
      if(!isNaN(h) && !isNaN(m) && h <= 23 && m <= 59){ startEl.value = pad(h) + ':' + pad(m); saveStart(); }
    } else if(params.has('now')){
      startEl.value = nowHHMM(); saveStart();
    }
  }

  startEl.addEventListener('input', () => { saveStart(); calc(); });
  brkInput.addEventListener('input', () => { saveSettings(); calc(); });
  paidEl.addEventListener('change', () => { saveSettings(); calc(); });

  loadStart();
  loadSettings();
  const params = new URLSearchParams(location.search);
  applyStartParams(params);
  syncSeg();
  calc();
  if(params.has('odchod')) recordDeparture();
  if((params.has('now') || params.has('start') || params.has('odchod')) && history.replaceState){
    history.replaceState(null, '', location.pathname);   // vyčisti URL
  }
  setInterval(updateNow, 1000);   // živá aktualizace každou vteřinu

  // offline režim (PWA)
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
