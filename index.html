<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Osobní píchačka</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c1726">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Píchačka">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#1c1726;
    --panel:#251d33;
    --line:#3a2f4d;
    --ink:#efe9df;
    --muted:#9a8fae;
    --amber:#ffb020;
    --amber-dim:#7a5410;
    --glow:rgba(255,176,32,.28);
    --red:#ff5c6c;
    --green:#43c67d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    background:
      radial-gradient(120% 80% at 50% -10%, #2a2138 0%, var(--bg) 60%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    overflow-y:auto;
    padding:calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
  }
  .card{
    width:100%;
    max-width:460px;
    margin:auto;
    position:relative;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:20px;
    padding:34px 30px 30px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.6);
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--amber);
    font-weight:600;
    margin-bottom:6px;
    text-align:center;
  }
  h1{
    font-size:26px;
    font-weight:700;
    letter-spacing:-.01em;
    margin-bottom:26px;
    text-align:center;
  }
  label{
    display:block;
    font-size:13px;
    color:var(--muted);
    margin-bottom:9px;
    letter-spacing:.02em;
  }
  .field{margin-bottom:22px}
  input[type="time"]{
    width:100%;
    background:#161020;
    border:1px solid var(--line);
    border-radius:12px;
    color:var(--ink);
    font-size:22px;
    font-family:"SFMono-Regular","Consolas",monospace;
    padding:14px 16px;
    letter-spacing:.06em;
  }
  input[type="time"]:focus,
  .seg button:focus-visible,
  input[type="time"]:focus-visible{
    outline:2px solid var(--amber);
    outline-offset:2px;
  }
  input[type="time"]::-webkit-calendar-picker-indicator{filter:invert(.7)}

  .seg-group{display:flex;flex-direction:column;gap:14px}
  .seg-cap{
    display:block;
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:7px;
  }
  .seg{display:flex;gap:10px}
  .seg button{
    flex:1;
    background:#161020;
    border:1px solid var(--line);
    border-radius:12px;
    color:var(--muted);
    font-size:16px;
    font-weight:600;
    padding:15px 0;
    cursor:pointer;
    transition:border-color .15s, color .15s, background .15s;
  }
  .seg button:hover{border-color:#5a4a76}
  .seg button.active{
    background:var(--amber);
    border-color:var(--amber);
    color:#1c1726;
  }
  .seg button .h{display:block;font-size:18px;line-height:1}
  .seg button .t{display:block;font-size:10px;letter-spacing:.04em;text-transform:uppercase;margin-top:4px;opacity:.75}

  .row{display:flex;gap:14px;align-items:flex-end}
  .row .field{flex:1;margin-bottom:0}

  .check{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:16px;
    cursor:pointer;
    user-select:none;
    font-size:14px;
    color:var(--ink);
  }
  .check input{position:absolute;opacity:0;width:0;height:0}
  .box{
    width:44px;
    height:26px;
    border-radius:999px;
    background:#161020;
    border:1px solid var(--line);
    position:relative;
    flex:none;
    transition:background .15s,border-color .15s;
  }
  .box::after{
    content:"";
    position:absolute;
    top:3px;left:3px;
    width:18px;height:18px;
    border-radius:50%;
    background:var(--muted);
    transition:transform .15s,background .15s;
  }
  .check input:checked + .box{background:var(--amber);border-color:var(--amber)}
  .check input:checked + .box::after{transform:translateX(18px);background:#1c1726}
  .check input:focus-visible + .box{outline:2px solid var(--amber);outline-offset:2px}
  .check .state{color:var(--muted);font-size:13px}

  .display{
    margin-top:26px;
    background:#120d1c;
    border:1px solid var(--line);
    border-radius:16px;
    padding:26px 20px 22px;
    text-align:center;
  }
  .display .lbl{
    font-size:12px;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:10px;
  }
  .clock{
    font-family:"SFMono-Regular","Consolas",monospace;
    font-size:64px;
    font-weight:700;
    letter-spacing:.05em;
    color:var(--amber);
    text-shadow:0 0 22px var(--glow);
    line-height:1;
  }
  .breakdown{
    margin-top:18px;
    font-size:13px;
    color:var(--muted);
    line-height:1.7;
  }
  .breakdown b{color:var(--ink);font-weight:600}

  .now-lbl{
    margin-top:16px;
    padding-top:16px;
    border-top:1px solid var(--line);
    font-size:12px;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--muted);
    text-align:center;
    margin-bottom:8px;
    min-height:15px;
  }
  .now{
    text-align:center;
    font-family:"SFMono-Regular","Consolas",monospace;
    font-weight:700;
    font-size:28px;
    letter-spacing:.05em;
    min-height:34px;
  }
  .now.over{ color:var(--green); }
  .now.left{ color:var(--red); }

  /* akční tlačítka pod výsledkem */
  .actions{ display:flex; gap:10px; margin-top:2px; }
  .punch{ display:flex; gap:10px; margin-top:2px; }
  .punch-btn{
    flex:1; padding:13px 10px; border:none; border-radius:12px;
    font-size:16px; font-weight:700; cursor:pointer; color:#1c1726;
  }
  .punch-btn.in{ background:var(--green); }
  .punch-btn.out{ background:var(--red); }
  .punch-btn:disabled{ opacity:.38; cursor:default; }
  .punch-bar{ display:flex; align-items:center; justify-content:center; gap:10px; margin-top:2px; }
  .punch2{ display:flex; gap:10px; margin-top:8px; }
  .mark-btn{ flex:1; padding:9px 8px; border:1px solid var(--line); border-radius:12px;
    background:#161020; color:var(--muted); font-weight:600; font-size:13px; cursor:pointer; }
  .mark-btn:active{ border-color:#5a4a76; }
  .mark-btn.para.active{ background:var(--amber); border-color:var(--amber); color:#1c1726; }
  .mark-btn.nemoc.active{ background:var(--red); border-color:var(--red); color:#1c1726; }
  .sp-para{ color:var(--amber); } .sp-nemoc{ color:var(--red); }
  .sp-dov{ color:#4aa3ff; } .sp-sva{ color:#c08bff; } .sp-nah{ color:var(--green); }
  .edit-date-to{ width:100%; padding:9px 10px; font-size:16px; margin-bottom:14px; }
  .status-txt{ font-size:12.5px; color:var(--muted); line-height:1.4; }
  .status-txt b{ color:var(--ink); font-weight:600; }
  .status-txt .pos{ color:var(--green); } .status-txt .neg{ color:var(--red); } .status-txt .zero{ color:var(--muted); }
  .link-btn{ background:transparent; border:none; color:var(--amber); font-size:13px; font-weight:600; cursor:pointer; padding:4px 2px; flex:none; }
  .act-btn{
    flex:1;
    padding:11px 10px;
    border-radius:12px;
    border:1px solid var(--line);
    background:#161020;
    color:var(--ink);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .act-btn:active{ border-color:#5a4a76; }
  .act-btn.primary{ background:var(--amber); border-color:var(--amber); color:#1c1726; }
  .act-btn.danger{ color:var(--red); }

  /* panel Historie */
  .sheet{
    position:fixed; inset:0; z-index:10;
    background:rgba(12,9,18,.72);
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
    display:flex; align-items:stretch; justify-content:center;
  }
  .sheet[hidden]{ display:none; }
  .sheet-inner{
    width:100%; max-width:460px; height:100dvh;
    display:flex; flex-direction:column; overflow:hidden;
    background:var(--panel); border-left:1px solid var(--line); border-right:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 18px);
  }
  .sheet-head, .totals, .sheet-actions{ flex:none; }
  .sheet-head{ position:relative; display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .head-add{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); }
  .sheet-head h2{ font-size:18px; font-weight:700; }
  .sheet-close{ background:transparent; border:none; color:var(--muted); font-size:18px; cursor:pointer; padding:4px 8px; }
  .head-actions{ display:flex; align-items:center; gap:6px; }
  .head-btn{ background:transparent; border:1px solid var(--line); border-radius:9px; color:var(--amber);
    font-size:18px; line-height:1; cursor:pointer; padding:4px 11px; }
  .head-btn:active{ border-color:#5a4a76; }
  .edit-lbl{ font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:2px 0 6px; }
  .edit-date{ width:100%; padding:9px 10px; font-size:16px; margin-bottom:14px; }
  .edit-pulstart{ width:100%; padding:9px 10px; font-size:16px; margin-bottom:14px; background:#161020; color:var(--ink); border:1px solid var(--line); border-radius:10px; }
  .svatek-row{ display:flex; align-items:center; gap:8px; font-size:14px; color:var(--ink); margin:2px 0 10px; cursor:pointer; }
  .svatek-row input{ width:18px; height:18px; accent-color:var(--amber); }
  .edit-half, .edit-fill{ width:100%; padding:11px 10px; font-size:16px; margin-bottom:14px; background:#161020; color:var(--ink); border:1px solid var(--line); border-radius:10px; }
  .fill-pick{ display:flex; gap:6px; margin-bottom:14px; }
  .fill-btn{ flex:1; background:transparent; border:1px solid var(--line); border-radius:10px;
    cursor:pointer; padding:8px 0; display:flex; align-items:center; justify-content:center; opacity:.5; min-height:44px; }
  .fill-btn .badge{ min-width:26px; width:26px; height:26px; }
  .fill-none{ color:var(--muted); font-size:20px; font-weight:700; }
  .fill-btn.on{ opacity:1; border-color:#6a5a86; background:#2c2340; }
  .plan-row{ display:flex; gap:6px; margin-bottom:14px; }
  .plan-btn{ flex:1; padding:8px 3px; border:1px solid var(--line); border-radius:10px;
    background:#161020; color:var(--muted); cursor:pointer; text-align:center; line-height:1.15; }
  .plan-btn .ph{ display:block; font-weight:700; font-size:15px; }
  .plan-btn .pc{ display:block; font-size:9px; letter-spacing:.06em; text-transform:uppercase; opacity:.8; margin-top:2px; }
  .plan-btn.on{ background:var(--amber); border-color:var(--amber); color:#1c1726; }
  .edit-brk-row{ display:flex; gap:8px; margin-bottom:14px; }
  .edit-brk-row .edit-brk{ flex:1; min-width:0; padding:9px 10px; font-size:16px; }
  .paid-toggle{ flex:none; padding:9px 16px; border-radius:10px; border:none;
    font-weight:700; font-size:13px; cursor:pointer; color:#1c1726; }
  .paid-toggle.paid{ background:var(--green); }
  .paid-toggle.unpaid{ background:var(--red); }
  .totals{ margin-bottom:14px; }
  .month-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .mnav{ background:#eaf2ff; border:1px solid #bcd4ff; border-radius:11px; color:#1565c0;
    cursor:pointer; padding:8px 16px; display:inline-flex; align-items:center; justify-content:center; }
  .mnav svg{ width:20px; height:20px; display:block; }
  .mnav:disabled{ opacity:.3; cursor:default; }
  .mnav:active:not(:disabled){ background:#d4e6ff; }
  .mlabel{ font-size:15px; font-weight:700; text-transform:capitalize; }
  .totals-cards{ display:flex; gap:10px; }
  .konto-card{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px;
    background:#161020; border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .konto-k{ font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
  .konto-v{ font-family:"SFMono-Regular","Consolas",monospace; font-size:22px; font-weight:700; }
  .konto-v.pos{ color:var(--green); } .konto-v.neg{ color:var(--red); } .konto-v.zero{ color:var(--ink); }
  .dov-days{ font-size:14px; font-weight:600; color:var(--muted); }
  .dov-val.pos, .dov-val.zero{ color:#4aa3ff; }
  .dov-card{ flex-direction:column; align-items:stretch; gap:8px; }
  .dov-head{ display:flex; align-items:center; justify-content:space-between; }
  .dov-sub{ display:flex; align-items:center; justify-content:space-between;
    font-size:12.5px; color:var(--muted); padding-top:6px; border-top:1px solid var(--line); }
  .dov-sub span:last-child{ font-family:"SFMono-Regular","Consolas",monospace; font-weight:600; }
  .dov-sub .sub-blue{ color:#4aa3ff; } .dov-sub .sub-neg{ color:var(--red); } .dov-sub .sub-pos{ color:var(--green); }
  .init-row{ display:flex; gap:10px; }
  .init-btn{ display:block; text-align:center; text-decoration:none; padding:12px; border-radius:12px;
    background:#161020; color:var(--ink); border:1px solid var(--line); font-size:15px; font-weight:600; }
  .init-btn:active{ border-color:#5a4a76; }
  .init-item{ flex:1; display:flex; flex-direction:column; gap:5px; }
  .init-lbl{ font-size:11px; color:var(--muted); }
  .init-item input{ width:100%; padding:10px; font-size:15px; text-align:right;
    background:#161020; color:var(--ink); border:1px solid var(--line); border-radius:10px; }
  .konto-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:8px; }
  .konto-row label{ font-size:12px; color:var(--muted); }
  .konto-row input{ width:90px; padding:7px 10px; font-size:15px; text-align:right;
    background:#161020; color:var(--ink); border:1px solid var(--line); border-radius:9px; }
  .tot{ flex:1; background:#161020; border:1px solid var(--line); border-radius:12px; padding:12px; text-align:center; }
  .tot .k{ font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .tot .v{ font-family:"SFMono-Regular","Consolas",monospace; font-size:20px; font-weight:700; margin-top:4px; }
  .tot .v.pos{ color:var(--green); } .tot .v.neg{ color:var(--red); } .tot .v.zero{ color:var(--muted); }
  .tot .sub{ font-size:11px; font-weight:600; margin-top:3px; }
  .tot .sub.pos{ color:var(--green); } .tot .sub.neg{ color:var(--red); } .tot .sub.zero{ color:var(--muted); }
  .live{ color:var(--amber); font-weight:600; font-size:11px; }
  .log{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; flex:1 1 auto; overflow-y:auto; min-height:80px; }
  .log-empty{ color:var(--muted); font-size:14px; text-align:center; padding:16px 0; }
  .rec{ display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:#161020; border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .rec .d{ font-size:13px; color:var(--ink); font-weight:600; }
  .rec .d-sub{ font-weight:400; color:var(--muted); }
  .rec .t{ font-size:12px; color:var(--muted); margin-top:2px; }
  .rec-main{ flex:1; min-width:0; }
  .rec-dow{ flex:none; width:26px; text-align:center; font-size:12.5px; font-weight:700; color:var(--muted); }
  .rec-dow.dow-sa{ color:var(--green); }
  .rec-dow.dow-ne{ color:var(--red); }
  .rec-actions{ display:flex; align-items:center; gap:6px; }
  .rec-badges{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; min-width:26px; flex:none; }
  .badge{ display:inline-flex; align-items:center; justify-content:center; min-width:22px; height:22px;
    padding:0 5px; border-radius:6px; font-size:12px; font-weight:700; color:#1c1726; }
  .b-para{ background:var(--amber); } .b-nv{ background:var(--green); } .b-nemoc{ background:#fff; }
  .b-pul{ background:#6b5bd0; color:#fff; }
  .b-dov{ background:#1e88e5; } .b-sva{ background:#2a2138; border:1px solid var(--line); }
  .b-smena{ background:#2a2138; border:1px solid var(--line); }
  .badge svg{ display:block; }
  .badge.ico{ padding:2px; }
  .badge.ico svg{ width:100%; height:100%; }
  .type-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
  .type-opt{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
    padding:10px 4px; border:1px solid var(--line); border-radius:12px; background:#161020;
    color:var(--muted); cursor:pointer; min-height:64px; }
  .type-opt.on{ border-color:var(--amber); background:#20182e; color:var(--ink); }
  .type-opt-l{ font-size:11px; font-weight:600; text-align:center; line-height:1.15; }
  .type-opt-ic .badge{ min-width:30px; height:30px; }
  .type-opt-ic .badge:not(.ico){ font-size:16px; }
  .rec .df{ font-family:"SFMono-Regular","Consolas",monospace; font-weight:700; font-size:15px; min-width:58px; text-align:right; }
  .df.pos{ color:var(--green); } .df.neg{ color:var(--red); } .df.zero{ color:var(--muted); }
  .rec-edit, .rec-del{ background:transparent; border:none; color:var(--muted); cursor:pointer; font-size:15px; padding:6px 8px; flex:none; }
  .rec-edit{ margin-right:2px; }
  .rec-edit:active, .rec-del:active{ color:var(--ink); }

  /* editace záznamu */
  .edit-head{ font-size:12.5px; color:var(--muted); margin-bottom:12px; line-height:1.4; }
  .edit-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .type-toggle{ flex:none; width:92px; padding:9px 6px; border-radius:10px; border:none;
    font-weight:700; font-size:13px; cursor:pointer; color:#1c1726; }
  .type-toggle.in{ background:var(--green); } .type-toggle.out{ background:var(--red); }
  .edit-row .edit-time{ flex:1; min-width:0; padding:9px 10px; font-size:16px; }
  .row-del{ flex:none; background:transparent; border:1px solid var(--line); border-radius:8px;
    color:var(--muted); font-size:14px; cursor:pointer; padding:6px 9px; }
  .para-toggle{ flex:none; background:transparent; border:1px solid var(--line); border-radius:8px;
    color:var(--muted); font-weight:700; font-size:15px; cursor:pointer; padding:6px 11px; }
  .para-toggle.on{ background:var(--green); border-color:var(--green); color:#1c1726; }
  .nv-toggle{ flex:none; background:transparent; border:1px solid var(--line); border-radius:8px;
    color:var(--muted); font-weight:700; font-size:12px; cursor:pointer; padding:6px 8px; }
  .nv-toggle.on{ background:var(--green); border-color:var(--green); color:#1c1726; }
  .dov-toggle{ flex:none; background:transparent; border:1px solid var(--line); border-radius:8px;
    color:var(--muted); font-weight:700; font-size:12px; cursor:pointer; padding:6px 8px; }
  .dov-toggle.on{ background:#1e88e5; border-color:#1e88e5; color:#fff; }
  .seg-pick{ display:flex; gap:6px; margin:-6px 0 12px 0; padding-left:2px; }
  .seg-btn{ flex:1; background:transparent; border:1px solid var(--line); border-radius:9px;
    cursor:pointer; padding:6px 0; display:flex; align-items:center; justify-content:center; opacity:.55; }
  .seg-btn .badge{ min-width:26px; width:26px; height:26px; }
  .seg-btn.on{ opacity:1; border-color:#6a5a86; background:#2c2340; }
  .add-punch{ margin-top:4px; }
  .sheet-actions{ display:flex; gap:10px; }
  .sheet-actions[hidden]{ display:none; }

  .toast{
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 24px);
    transform:translateX(-50%); z-index:20;
    background:#161020; border:1px solid var(--line); border-radius:999px;
    color:var(--ink); font-size:14px; font-weight:600; padding:10px 18px;
    box-shadow:0 12px 30px -10px rgba(0,0,0,.6); max-width:90vw; text-align:center;
  }
  .toast[hidden]{ display:none; }

  .dialog{
    position:fixed; inset:0; z-index:30;
    background:rgba(12,9,18,.72);
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .dialog[hidden]{ display:none; }
  .dialog-box{
    width:100%; max-width:340px;
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:22px 20px 18px;
    box-shadow:0 24px 50px -18px rgba(0,0,0,.6);
  }
  .dialog-msg{ font-size:15px; color:var(--ink); line-height:1.5; text-align:center; margin-bottom:20px; }
  .dialog-actions{ display:flex; gap:10px; }
  .dialog-actions .act-btn{ flex:1; }
  a.act-btn{ text-decoration:none; display:inline-flex; align-items:center; justify-content:center; }
  .act-btn.danger-solid{ background:var(--red); border-color:var(--red); color:#1c1726; }
  .foot{
    margin-top:18px;
    font-size:12px;
    color:var(--muted);
    text-align:center;
  }
  @media (prefers-reduced-motion:no-preference){
    .clock{transition:opacity .2s}
  }

  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
  }
  .corner-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    line-height:0;
    color:var(--muted);
    padding:8px;
    border-radius:12px;
    border:1px solid var(--line);
    background:rgba(22,15,32,.55);
    -webkit-backdrop-filter:blur(4px);
    backdrop-filter:blur(4px);
    cursor:pointer;
  }
  .corner-btn:active{color:var(--amber);border-color:#5a4a76}
  .corner-btn:disabled{opacity:.35;cursor:default}
  .corner-btn:disabled:active{color:var(--muted);border-color:var(--line)}

  .start-row{
    display:flex;
    gap:10px;
    align-items:stretch;
  }
  .start-row input[type="time"]{
    flex:1;
    min-width:0;
  }
  .now-btn{
    flex:0 0 auto;
    padding:0 24px;
    border:none;
    border-radius:12px;
    background:var(--amber);
    color:#1c1726;
    font-size:16px;
    font-weight:700;
    letter-spacing:.02em;
    cursor:pointer;
  }
  .now-btn:active{filter:brightness(.93)}

  /* --- Mobil: celá obrazovka bez scrollování --- */
  @media (max-width:520px){
    body{
      padding:0;
      align-items:stretch;
      overflow-y:auto;               /* když se nevejde, radši doscrolluj než ořízni */
    }
    .card{
      max-width:none;
      margin:0;
      min-height:100dvh;
      border:none;
      border-radius:0;
      box-shadow:none;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;    /* obsah odshora – žádná velká mezera nahoře */
      gap:clamp(4px,1vh,12px);
      padding:calc(env(safe-area-inset-top) + 10px)
              calc(env(safe-area-inset-right) + 20px)
              calc(env(safe-area-inset-bottom) + 14px)
              calc(env(safe-area-inset-left) + 20px);
    }
    /* zruš pevné spodní mezery – rozestupy řeší gap na kartě */
    h1{margin-bottom:0;font-size:clamp(20px,5.2vw,26px)}
    .field{margin-bottom:0}
    label{margin-bottom:4px}
    .seg-group{gap:clamp(7px,1.3vh,14px)}
    .seg-cap{margin-bottom:5px}
    input[type="time"]{padding:clamp(8px,1.2vh,13px) 16px;font-size:19px}
    .seg button{padding:clamp(8px,1.3vh,14px) 0}
    .seg button .h{font-size:17px}
    .now-btn{padding:0 20px;font-size:15px}
    .check{margin-top:clamp(7px,1.2vh,14px)}
    .display{margin-top:0;padding:clamp(10px,1.4vh,16px) 16px}
    .display .lbl{margin-bottom:5px}
    .breakdown{margin-top:8px}
    .clock{font-size:clamp(30px,9.5vw,50px)}
    .now-lbl{margin-top:clamp(6px,1vh,10px);padding-top:clamp(6px,1vh,10px);min-height:0;margin-bottom:4px}
    .now{font-size:clamp(18px,6vw,26px);min-height:24px}
    .act-btn{padding:10px 8px;font-size:13px}
    .punch-btn{padding:11px 8px;font-size:15px}
    .mark-btn{padding:8px 6px}
    .punch2{margin-top:6px}
    .init-item input{padding:8px 10px}
    .status-txt{font-size:12px}
  }
</style>
</head>
<body>
  <main class="card">
    <div class="toolbar">
      <button class="corner-btn" id="calBtn" type="button"
              aria-label="Přidat připomínku do kalendáře" title="Připomínka v kalendáři">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M7 2h2v2h6V2h2v2h1a2 2 0 0 1 2 2v2H4V6a2 2 0 0 1 2-2h1V2z"/>
          <path d="M4 10h16v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-9zm3 3v2h2v-2H7zm4 0v2h2v-2h-2zm4 0v2h2v-2h-2z"/>
        </svg>
      </button>

      <button class="corner-btn" id="histBtn" type="button" aria-label="Historie" title="Historie">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M13 3a9 9 0 1 0 8.94 10H19.9A7 7 0 1 1 13 5a6.9 6.9 0 0 1 4.9 2.05L15 10h7V3l-2.6 2.6A9 9 0 0 0 13 3z"/>
          <path d="M12 8h1.6v4.3l3.2 1.9-.8 1.35L12 13.2z"/>
        </svg>
      </button>

     <a class="corner-btn" href="sdilet.html" aria-label="Sdílet appku (QR kód)" title="Sdílet · QR">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M3 3h7v7H3V3zm2 2v3h3V5H5z"/>
          <path d="M14 3h7v7h-7V3zm2 2v3h3V5h-3z"/>
          <path d="M3 14h7v7H3v-7zm2 2v3h3v-3H5z"/>
          <path d="M14 14h2v2h-2zM18 14h3v2h-3zM16 16h2v2h-2zM14 18h2v3h-2zM18 18h3v3h-3z"/>
        </svg>
      </a>
	  
	  <a class="corner-btn" href="napoveda.html" aria-label="Nápověda" title="Nápověda">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 3.4a3.6 3.6 0 0 1 3.6 3.6c0 1.9-1.3 2.6-2.2 3.2-.6.4-1 .7-1 1.3v.4h-1.9v-.6c0-1.5 1-2.2 1.8-2.7.7-.5 1.2-.8 1.2-1.6a1.7 1.7 0 0 0-3.4 0H8.4A3.6 3.6 0 0 1 12 5.4zM11 16.2h2v2h-2z"/>
        </svg>
      </a>
	  
    </div>

    <h1>Osobní píchačka</h1>

    <div class="punch">
      <button type="button" class="punch-btn in" id="inBtn">Příchod</button>
      <button type="button" class="punch-btn out" id="outBtn">Odchod</button>
    </div>
    <div class="punch-bar">
      <span class="status-txt" id="statusTxt"></span>
    </div>

    <div class="display">
      <div class="lbl">Odchod domů</div>
      <div class="clock" id="result" aria-live="polite">–:–</div>
      <div class="breakdown" id="breakdown"></div>
      <div class="now-lbl" id="nowLbl"></div>
      <div class="now" id="now"></div>
    </div>

    <div class="field">
      <label for="start">Začátek směny</label>
      <input type="time" id="start">
    </div>

    <div class="field">
      <label>Pracovní doba</label>
      <div class="seg" id="seg" role="group" aria-label="Pracovní doba">
        <button type="button" data-min="360"><span class="h">6</span><span class="t">zkrácená</span></button>
        <button type="button" data-min="480"><span class="h">8</span><span class="t">ranní</span></button>
        <button type="button" data-min="450"><span class="h">7:30</span><span class="t">odpol.</span></button>
        <button type="button" data-min="420"><span class="h">7:00</span><span class="t">noční</span></button>
      </div>
    </div>

    <div class="field">
      <label for="brk">Svačina</label>
      <input type="time" id="brk" value="00:30">
      <label class="check" for="paid">
        <input type="checkbox" id="paid">
        <span class="box"></span>
        <span>Placená pauza <span class="state" id="paidState">(neplacená → přičítá se)</span></span>
      </label>
    </div>

    <div class="field">
      <a class="init-btn" href="stavy.html">⚙ Počáteční stavy (konto, dovolená)</a>
    </div>
  </main>

  <div class="sheet" id="history" hidden>
    <div class="sheet-inner">
      <div class="sheet-head">
        <h2 id="sheetTitle">Historie</h2>
        <button type="button" class="head-btn head-add" id="addDayBtn" aria-label="Přidat den" title="Přidat den">＋</button>
        <button type="button" class="sheet-close" id="histClose" aria-label="Zavřít">✕</button>
      </div>
      <div class="totals" id="totals"></div>
      <div class="log" id="logList"></div>
      <div class="sheet-actions" id="viewActions">
        <a class="act-btn" href="zaloha.html" style="text-align:center;text-decoration:none;line-height:1.2">Záloha</a>
        <button type="button" class="act-btn danger" id="clearBtn">Vymazat měsíc</button>
      </div>
      <div class="sheet-actions" id="editActions" hidden>
        <button type="button" class="act-btn primary" id="saveEditBtn">Uložit</button>
        <button type="button" class="act-btn" id="cancelEditBtn">Zrušit</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <div class="dialog" id="confirmDlg" hidden>
    <div class="dialog-box">
      <div class="dialog-msg" id="confirmMsg"></div>
      <div class="dialog-actions">
        <button type="button" class="act-btn" id="confirmCancel">Zrušit</button>
        <button type="button" class="act-btn danger-solid" id="confirmOk">Smazat</button>
      </div>
    </div>
  </div>

  <div class="dialog" id="icsDlg" hidden>
    <div class="dialog-box">
      <div class="dialog-msg">Připomínka do kalendáře<br>Odchod domů v <b id="icsTime">–</b></div>
      <div class="dialog-actions">
        <button type="button" class="act-btn" id="icsCancel">Zrušit</button>
        <a class="act-btn primary" id="icsGoogle" target="_blank" rel="noopener">Přidat</a>
      </div>
      <a id="icsDownload" download style="display:block;text-align:center;margin-top:12px;font-size:13px;color:var(--muted);text-decoration:none">Stáhnout .ics (jiný kalendář)</a>
    </div>
  </div>

<script>
  const startEl = document.getElementById('start');
  const segEl   = document.getElementById('seg');
  const brkInput= document.getElementById('brk');
  const paidEl  = document.getElementById('paid');
  const paidTxt = document.getElementById('paidState');
  const resEl   = document.getElementById('result');
  const brkEl   = document.getElementById('breakdown');
  const nowEl   = document.getElementById('now');
  const nowLbl  = document.getElementById('nowLbl');
  const calBtn  = document.getElementById('calBtn');
  let workMin = 480;   // ← výchozí doba v minutách (360=6h, 420=7:00, 450=7:30, 480=8h)
  let startTotal = null;  // začátek v minutách od půlnoci
  let endTotal   = null;  // odchod v minutách od půlnoci (může přesáhnout 1440)

  function pad(n){ return String(n).padStart(2,'0'); }

  function syncSeg(){
    segEl.querySelectorAll('button').forEach(b =>
      b.classList.toggle('active', Number(b.dataset.min) === workMin));
  }

  function breakMinutes(){
    const v = brkInput.value;
    if(!v) return 0;
    const [h, m] = v.split(':').map(Number);
    return h*60 + m;
  }

  function calc(){
    const v = startEl.value;
    if(!v){
      resEl.textContent = '–:–';
      brkEl.textContent = '';
      nowEl.textContent = '';
      startTotal = endTotal = null;
      if(calBtn) calBtn.disabled = true;
      return;
    }

    const [sh, sm] = v.split(':').map(Number);
    const brk  = breakMinutes();
    const paid = paidEl.checked;
    // placená pauza se počítá jako práce → do odchodu se nepřičítá
    const addBreak = paid ? 0 : brk;

    startTotal = sh*60 + sm;
    const total = startTotal + workMin + addBreak;   // minuty od půlnoci
    endTotal = total;
    const endMin = ((total % 1440) + 1440) % 1440;    // ošetření přes půlnoc
    const eh = Math.floor(endMin / 60);
    const em = endMin % 60;

    const workLbl = pad(Math.floor(workMin/60)) + ':' + pad(workMin%60);
    paidTxt.textContent = paid ? '(placená → nepřičítá se)' : '(neplacená → přičítá se)';

    resEl.textContent = pad(eh) + ':' + pad(em);
    brkEl.innerHTML =
      'Začátek <b>' + pad(sh) + ':' + pad(sm) + '</b> + '
      + '<b>' + workLbl + '</b> práce'
      + (paid
          ? ' <span style="opacity:.6">(pauza ' + pad(Math.floor(brk/60)) + ':' + pad(brk%60) + ' placená)</span>'
          : ' + <b>' + pad(Math.floor(brk/60)) + ':' + pad(brk%60) + '</b> pauza')
      + (total >= 1440 ? ' <b>(další den)</b>' : '');

    if(calBtn) calBtn.disabled = false;
    updateNow();
  }

  function updateNow(){
    if(endTotal === null){
      nowEl.textContent = ''; nowEl.className = 'now';
      nowLbl.textContent = '';
      return;
    }

    const d = new Date();
    let nowMin = d.getHours()*60 + d.getMinutes();
    // pokud odchod přetéká přes půlnoc a je zrovna po půlnoci, posuň "teď" na další den
    if(endTotal >= 1440 && nowMin < startTotal) nowMin += 1440;

    const diff = nowMin - endTotal;          // >0 přesčas, <0 zbývá
    const abs  = Math.abs(diff);
    const hhmm = pad(Math.floor(abs/60)) + ':' + pad(abs%60);

    if(diff < 0){                            // ještě pracuješ → zbývá, červeně
      nowLbl.textContent = 'Zbývá';
      nowEl.className = 'now left';
      nowEl.textContent = '-' + hhmm;
    } else {                                 // odchod nebo přesčas → zeleně
      nowLbl.textContent = 'Přesčas';
      nowEl.className = 'now over';
      nowEl.textContent = '+' + hhmm;
    }
  }

  segEl.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if(!btn) return;
    workMin = Number(btn.dataset.min);
    syncSeg();
    saveSettings();
    calc();
  });

  // --- Začátek směny se odvozuje z prvního Příchodu (ruční zadání jen pro výpočet) ---
  function nowHHMM(){
    const d = new Date();
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  // při otevření vezmi začátek z prvního Příchodu jen když směna běží
  function syncStartFromShift(){
    const store = loadPunch();
    const key = activeShiftKey(store);
    if(key && store[key].punches && store[key].punches.length){
      const arr = store[key].punches;
      const running = arr[arr.length-1].k === 'in';   // poslední píchnutí = Příchod → běží
      if(running){
        const firstIn = arr.find(p => p.k === 'in');
        if(firstIn){ startEl.value = firstIn.t; return; }
      }
    }
    startEl.value = '';   // ukončená / žádná směna → prázdné pole
  }

  // --- uložení pracovní doby a svačiny (trvalá předvolba) ---
  const SET_KEY = 'kdyDomu.settings';
  const WORK_OK = [360, 420, 450, 480];

  function saveSettings(){
    try{
      localStorage.setItem(SET_KEY, JSON.stringify({
        workMin: workMin,
        brk: brkInput.value,
        paid: paidEl.checked
      }));
    }catch(e){}
  }

  function loadSettings(){
    try{
      const raw = localStorage.getItem(SET_KEY);
      if(!raw) return;
      const s = JSON.parse(raw);
      if(WORK_OK.includes(s.workMin)) workMin = s.workMin;
      if(typeof s.brk === 'string' && /^\d{1,2}:\d{2}$/.test(s.brk)) brkInput.value = s.brk;
      if(typeof s.paid === 'boolean') paidEl.checked = s.paid;
    }catch(e){}
  }

  // --- připomínka do kalendáře (.ics) ---
  function icsLocal(dt){
    return dt.getFullYear() + pad(dt.getMonth()+1) + pad(dt.getDate())
      + 'T' + pad(dt.getHours()) + pad(dt.getMinutes()) + '00';
  }
  function icsUTC(dt){
    return dt.getUTCFullYear() + pad(dt.getUTCMonth()+1) + pad(dt.getUTCDate())
      + 'T' + pad(dt.getUTCHours()) + pad(dt.getUTCMinutes()) + pad(dt.getUTCSeconds()) + 'Z';
  }

  // ID události unikátní pro každý DEN (datum odchodu) → nová událost každý den,
  // opětovný export téhož dne jen zvýší verzi (SEQUENCE) a událost daného dne přepíše
  function eventMeta(depDate){
    const key = ymd(depDate) + '-' + pad(depDate.getHours()) + pad(depDate.getMinutes());
    let map = {};
    try{ map = JSON.parse(localStorage.getItem('kdyDomu.evt') || '{}') || {}; }catch(e){}
    if(map && map.uid) map = {};                 // migrace ze starého formátu
    const seq = map[key] | 0;
    map[key] = seq + 1;
    try{ localStorage.setItem('kdyDomu.evt', JSON.stringify(map)); }catch(e){}
    return { uid: 'kdydomu-' + key.replace(/-/g,'') + '@drumclock.github.io', seq: seq };
  }

  function buildICS(){
    // odchod jako reálné datum: dnešní půlnoc + endTotal minut (přeteče na další den samo)
    const base = new Date();
    const dep = new Date(base.getFullYear(), base.getMonth(), base.getDate(), 0, 0, 0, 0);
    dep.setMinutes(endTotal);
    const end = new Date(dep.getTime() + 15 * 60000);
    const meta = eventMeta(dep);

    const text = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//Kdy domu//CS',
      'CALSCALE:GREGORIAN',
      'METHOD:PUBLISH',
      'BEGIN:VEVENT',
      'UID:' + meta.uid,
      'SEQUENCE:' + meta.seq,
      'DTSTAMP:' + icsUTC(new Date()),
      'DTSTART:' + icsLocal(dep),
      'DTEND:' + icsLocal(end),
      'SUMMARY:Odchod domů 🏠',
      'DESCRIPTION:Konec směny – můžeš jít domů.',
      'BEGIN:VALARM',
      'ACTION:DISPLAY',
      'DESCRIPTION:Odchod domů',
      'TRIGGER;RELATED=START:PT0S',
      'END:VALARM',
      'END:VEVENT',
      'END:VCALENDAR'
    ].join('\r\n');
    const depH = pad(dep.getHours()), depM = pad(dep.getMinutes());
    return { text, fname: 'odchod-domu-' + ymd(dep) + '-' + depH + depM + '.ics', dep };
  }

  const icsDlg = document.getElementById('icsDlg');
  const icsGoogle = document.getElementById('icsGoogle');
  const icsDownload = document.getElementById('icsDownload');
  const icsTime = document.getElementById('icsTime');
  const icsCancel = document.getElementById('icsCancel');
  let icsUrl = null;
  function closeIcs(){ icsDlg.hidden = true; if(icsUrl){ URL.revokeObjectURL(icsUrl); icsUrl = null; } }
  function gcalUrl(dep){
    const end = new Date(dep.getTime() + 15*60000);
    const f = d => '' + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + 'T' + pad(d.getHours()) + pad(d.getMinutes()) + '00';
    const p = new URLSearchParams({
      action:'TEMPLATE',
      text:'Odchod domů 🏠',
      dates: f(dep) + '/' + f(end),
      details:'Konec směny – můžeš jít domů.',
      ctz:'Europe/Prague'
    });
    return 'https://calendar.google.com/calendar/render?' + p.toString();
  }

  calBtn.addEventListener('click', () => {
    if(endTotal === null) return;
    const ics = buildICS();                                 // připraví jedinečný soubor + čas odchodu
    icsGoogle.href = gcalUrl(ics.dep);                      // hlavní: odkaz do Google Kalendáře (spolehlivé)
    const blob = new Blob([ics.text], { type: 'text/calendar;charset=utf-8' });
    if(icsUrl) URL.revokeObjectURL(icsUrl);
    icsUrl = URL.createObjectURL(blob);
    icsDownload.href = icsUrl;                              // záloha: stažení .ics
    icsDownload.download = ics.fname;
    icsTime.textContent = resEl.textContent;               // čas odchodu HH:MM
    icsDlg.hidden = false;
  });
  icsGoogle.addEventListener('click', () => { setTimeout(closeIcs, 300); });
  icsDownload.addEventListener('click', () => { setTimeout(closeIcs, 300); });
  icsCancel.addEventListener('click', closeIcs);
  icsDlg.addEventListener('click', e => { if(e.target === icsDlg) closeIcs(); });

  // ===== Píchačky: příchod / odchod / přerušení =====
  const PUNCH_KEY = 'kdyDomu.punch';
  const inBtn    = document.getElementById('inBtn');
  const outBtn   = document.getElementById('outBtn');
  const histBtn  = document.getElementById('histBtn');
  const histEl   = document.getElementById('history');
  const histClose= document.getElementById('histClose');
  const totalsEl = document.getElementById('totals');
  const logListEl= document.getElementById('logList');
  const clearBtn = document.getElementById('clearBtn');
  const toastEl  = document.getElementById('toast');
  const statusTxt= document.getElementById('statusTxt');
  const confirmDlg   = document.getElementById('confirmDlg');
  const confirmMsg   = document.getElementById('confirmMsg');
  const confirmOk    = document.getElementById('confirmOk');
  const confirmCancel= document.getElementById('confirmCancel');
  let confirmResolver = null;
  function askConfirm(msg, okLabel){
    confirmMsg.textContent = msg;
    confirmOk.textContent = okLabel || 'Smazat';
    confirmDlg.hidden = false;
    return new Promise(res => { confirmResolver = res; });
  }
  function closeConfirm(val){
    confirmDlg.hidden = true;
    if(confirmResolver){ confirmResolver(val); confirmResolver = null; }
  }
  confirmOk.addEventListener('click', () => closeConfirm(true));
  confirmCancel.addEventListener('click', () => closeConfirm(false));
  confirmDlg.addEventListener('click', e => { if(e.target === confirmDlg) closeConfirm(false); });
  const sheetTitle   = document.getElementById('sheetTitle');
  const viewActions  = document.getElementById('viewActions');
  const editActions  = document.getElementById('editActions');
  const saveEditBtn  = document.getElementById('saveEditBtn');
  const cancelEditBtn= document.getElementById('cancelEditBtn');
  const addDayBtn    = document.getElementById('addDayBtn');
  let editDate = null, editKey = null, editArr = null, editBrk = 30, editPaid = false, editPlan = 480, editHoliday = false;
  let editType = 'smena', editKeyTo = null;
  let editPulStart = '08:00', editHalfA = 'prace', editHalfB = 'dovolena';
  let editFill = '';   // zbytek do plné směny: ''|paragraf|dovolena|nahradni|svatek|nemoc
  let histMonth = null;
  const TYPE_LABELS = { smena:'Směna', paragraf:'Paragraf', nemoc:'Nemoc', dovolena:'Dovolená', svatek:'Svátek', nahradni:'Náhradní volno', pulden:'Půl dne' };
  const HALF_LABELS = { prace:'Práce', paragraf:'Paragraf', dovolena:'Dovolená', nahradni:'Náhradní volno' };

  function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  function hhmm(min){ min=((min%1440)+1440)%1440; return pad(Math.floor(min/60)) + ':' + pad(min%60); }
  function dur(min){ const a=Math.abs(min); return (min<0?'-':'') + Math.floor(a/60) + ':' + pad(a%60); }
  function sdur(min){ const a=Math.abs(min); return (min<0?'-':'+') + Math.floor(a/60) + ':' + pad(a%60); }
  function diffClass(v){ return v>0 ? 'pos' : (v<0 ? 'neg' : 'zero'); }
  function startOfWeek(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; }
  function toMin(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
  function nowMin(){ const d=new Date(); return d.getHours()*60 + d.getMinutes(); }

  function loadPunch(){ try{ return JSON.parse(localStorage.getItem(PUNCH_KEY) || '{}'); }catch(e){ return {}; } }
  function savePunch(o){ try{ localStorage.setItem(PUNCH_KEY, JSON.stringify(o)); }catch(e){} }

  const KONTO_KEY = 'kdyDomu.konto0';
  function loadKonto(){ const v = parseInt(localStorage.getItem(KONTO_KEY) || '0', 10); return isNaN(v) ? 0 : v; }
  function saveKonto(min){ try{ localStorage.setItem(KONTO_KEY, String(min|0)); }catch(e){} }
  const DOV_KEY = 'kdyDomu.dov0';
  function loadDov(){ const v = parseInt(localStorage.getItem(DOV_KEY) || '0', 10); return isNaN(v) ? 0 : v; }
  function saveDov(min){ try{ localStorage.setItem(DOV_KEY, String(min|0)); }catch(e){} }

  // snímky počátečních stavů: [{d:'YYYY-MM-DD', m:minuty}], seřazené vzestupně dle data
  function loadSnaps(key, oldMin){
    let arr = [];
    try{ arr = JSON.parse(localStorage.getItem(key) || '[]') || []; }catch(e){ arr = []; }
    if(!Array.isArray(arr)) arr = [];
    if(!arr.length && oldMin){ arr = [{ d:'2000-01-01', m: oldMin }]; }   // migrace z jedné hodnoty
    return arr.filter(x => x && x.d).sort((a,b)=> a.d < b.d ? -1 : a.d > b.d ? 1 : 0);
  }
  function loadKontoSnaps(){ return loadSnaps('kdyDomu.kontoSnaps', loadKonto()); }
  function loadDovSnaps(){ return loadSnaps('kdyDomu.dovSnaps', loadDov()); }
  // základní snímek platný ke konci daného měsíce (poslední s datem ≤ konec měsíce)
  function baseSnap(snaps, y, m){
    const endKey = y + '-' + pad(m+1) + '-31';
    let base = null;
    for(const s of snaps){ if(s.d <= endKey) base = s; else break; }
    return base || snaps[0] || { d:'2000-01-01', m:0 };
  }
  function nextSnapDate(snaps, afterDate){
    for(const s of snaps){ if(s.d > afterDate) return s.d; }
    return null;
  }
  function parseSigned(str){                         // "+12:00" / "-1:30" / "12:00" / "12" → minuty
    str = (str || '').trim().replace(',', ':');
    if(!str) return 0;
    let sign = 1;
    if(str[0] === '-'){ sign = -1; str = str.slice(1); } else if(str[0] === '+'){ str = str.slice(1); }
    let h = 0, m = 0;
    if(str.includes(':')){ const p = str.split(':'); h = parseInt(p[0]||'0',10)||0; m = parseInt(p[1]||'0',10)||0; }
    else { h = parseInt(str,10)||0; }
    return sign * (h*60 + m);
  }

  let toastTimer;
  function toast(msg){
    toastEl.textContent = msg; toastEl.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastEl.hidden = true; }, 2600);
  }

  // souhrn dne z pole píchnutí (otevřená směna se počítá k aktuálnímu času)
  function daySummary(day, dateKey){
    if(day && day.type){   // celodenní typy
      if(day.type === 'nahradni'){                 // náhradní volno = délka směny; +do práce, −z přesčasu
        const amt = day.plan != null ? day.plan : workMin;
        return { special:true, type:'nahradni', worked:amt, breaks:0, paidBreaks:0, snack:0, over:-amt, open:false, plan:amt, punches:[] };
      }
      if(day.type === 'pulden'){                    // den složený ze dvou půlek plánu
        const plan = day.plan != null ? day.plan : workMin;
        const half = Math.round(plan/2);
        let work=0, para=0, dov=0, nv=0;
        [day.a, day.b].forEach(t => {
          if(t==='prace') work += half; else if(t==='paragraf') para += half;
          else if(t==='dovolena') dov += half; else if(t==='nahradni') nv += half;
        });
        const worked = work + nv;
        const over = work + para + dov - plan;
        const st = day.start ? toMin(day.start) : null;
        return { special:true, type:'pulden', worked, breaks:0, paidBreaks:para, snack:0, over,
                 open:false, plan, dovMin:dov, nv:(nv>0), a:day.a, b:day.b, half,
                 start: st, end: (st!=null ? st+plan : null), punches:[] };
      }
      // paragraf / nemoc / dovolená / svátek → nepočítá se do odpracováno ani přesčasu
      const dovMin = (day.type === 'dovolena') ? (day.plan != null ? day.plan : workMin) : 0;
      return { special:true, neutral:true, type:day.type, worked:0, breaks:0, paidBreaks:0, snack:0, over:null, open:false, dovMin, punches:[] };
    }
    const arr = (day && day.punches) || [];
    if(!arr.length) return null;
    const plan = (day && day.plan != null) ? day.plan : null;
    let mins = arr.map(p => toMin(p.t));
    for(let i=1;i<mins.length;i++){ while(mins[i] < mins[i-1]) mins[i] += 1440; }
    const kinds = arr.map(p => p.k);
    const open = kinds[kinds.length-1] === 'in';
    const start = mins[0];

    // NOVÝ MODEL: čistá práce (Příchod/Odchod) + denní „zbytek do plné směny" (fill)
    const hasSeg = arr.some(p => p.k === 'out' && p.seg && p.seg !== 'prace');
    const hasOldFlag = arr.some(p => p.k === 'out' && (p.paid || p.nv || p.dov));
    if(!hasSeg && !hasOldFlag){
      let endN;
      if(open){ let n=nowMin(); while(n < mins[mins.length-1]) n += 1440; endN = n; }
      else endN = mins[mins.length-1];
      let work=0, breaks=0;
      for(let i=0;i<arr.length-1;i++){
        const d = mins[i+1]-mins[i];
        if(kinds[i]==='in' && kinds[i+1]==='out') work += d;
        else if(kinds[i]==='out' && kinds[i+1]==='in') breaks += d;
      }
      if(open) work += endN - mins[mins.length-1];
      const hasOwn = day && day.brk != null;
      const snackMin = hasOwn ? day.brk : breakMinutes();
      const isPaid = hasOwn ? !!day.paid : paidEl.checked;
      const wd = dateKey ? new Date(dateKey + 'T00:00:00').getDay() : -1;
      const isHoliday = !!(day && day.holiday);
      const isWeekend = (wd === 0 || wd === 6);
      // svačina: zkrácená (≤6h) a víkend/svátek → jen když práce > 6h; klasická (8/7:30/7h) → i pod 6h
      const classicWeekday = !isWeekend && !isHoliday && plan != null && plan > 360;
      const snackThr = classicWeekday ? 0 : 360;
      const snack = (!isPaid && work > snackThr) ? snackMin : 0;
      const actualWork = Math.max(0, work - snack);

      if((isHoliday || isWeekend) && !open){
        if(isHoliday){
          return { start, end: mins[mins.length-1], worked: actualWork, breaks, paidBreaks: 0, snack,
                   open:false, plan: 0, over: 0, nv:false, dovMin: 0, kd: 0, fill:null, seg:true, holiday:true,
                   segTypes: { prace:actualWork>0, svatek:true }, punches: arr };
        }
        return { start, end: mins[mins.length-1], worked: actualWork, breaks, paidBreaks: 0, snack,
                 open:false, plan: 0, over: actualWork, nv:false, dovMin: 0, kd: actualWork, fill:null, seg:true, weekend:true,
                 segTypes: { prace:actualWork>0 }, punches: arr };
      }

      const fill = day && day.fill;
      let over=null, nvFill=0, dovMin=0, paraTotal=0, kd=0;
      if(plan != null){
        const deficit = Math.max(0, plan - actualWork);
        if(fill && deficit > 0){
          if(fill==='nahradni'){ nvFill = deficit; over = actualWork - plan; }
          else if(fill==='dovolena'){ dovMin = deficit; over = 0; }
          else { paraTotal = deficit; over = 0; }          // paragraf / svátek / nemoc
        } else over = actualWork - plan;
        if(fill==='nahradni' && deficit>0) kd = -deficit;
        else if(over > 0) kd = (plan<=360) ? Math.max(0, actualWork-480) : over;
        else if(over < 0) kd = (plan<=360) ? 0 : over;
      }
      const worked = actualWork + nvFill;
      const dfl = (fill && plan!=null && (plan-actualWork)>0) ? fill : null;
      return { start, end: open?null:mins[mins.length-1], worked, breaks, paidBreaks: paraTotal, snack,
               open, plan, over, nv:(nvFill>0), dovMin, kd, fill:dfl, seg:true,
               segTypes: { prace:actualWork>0, paragraf:dfl==='paragraf', dovolena:dfl==='dovolena', nahradni:dfl==='nahradni', svatek:dfl==='svatek', nemoc:dfl==='nemoc' },
               punches: arr };
    }

    // ZPĚTNÁ KOMPATIBILITA: starý úsekový model (typ na odchodu `seg`)
    if(hasSeg){
      let endN;
      if(open){ let n=nowMin(); while(n < mins[mins.length-1]) n += 1440; endN = n; }
      else endN = mins[mins.length-1];
      let work=0, nv=0, para=0, dov=0, svatek=0, nemoc=0, breaks=0;
      for(let i=0;i<arr.length-1;i++){
        const d = mins[i+1]-mins[i];
        if(kinds[i]==='in' && kinds[i+1]==='out'){
          const t = arr[i+1].seg || 'prace';
          if(t==='nahradni') nv+=d; else if(t==='paragraf') para+=d;
          else if(t==='dovolena') dov+=d; else if(t==='svatek') svatek+=d;
          else if(t==='nemoc') nemoc+=d; else work+=d;
        } else if(kinds[i]==='out' && kinds[i+1]==='in'){ breaks+=d; }
      }
      if(open) work += endN - mins[mins.length-1];       // rozjetý úsek = práce
      const hasOwn = day && day.brk != null;
      const snackMin = hasOwn ? day.brk : breakMinutes();
      const isPaid = hasOwn ? !!day.paid : paidEl.checked;
      const snack = (!isPaid && work > 360) ? snackMin : 0;
      const actualWork = Math.max(0, work - snack);

      let over = null, nvFill = 0, dovUsed = 0, kd = 0;
      if(plan != null){
        // §/svátek/nemoc = neutrální doplnění; dovolená doplní a čerpá; NV doplní a čerpá konto
        let deficit = Math.max(0, plan - actualWork);
        const neutral = para + svatek + nemoc;
        const credit  = Math.min(neutral, deficit); deficit -= credit;
        dovUsed = Math.min(dov, deficit); deficit -= dovUsed;
        over = actualWork + credit + dovUsed - plan;       // ≤0 = schodek, >0 = práce nad plán
        nvFill = Math.min(nv, Math.max(0, -over));           // NV doplní zbytek schodku
        // konto: klasická = celý přesčas i schodek; zkrácená = jen práce nad 8 h, NV čerpá vždy
        if(plan <= 360) kd = (over > 0) ? Math.max(0, actualWork - 480) : -nvFill;
        else            kd = over;
      }
      const worked = actualWork + nvFill;
      return { start, end: open?null:mins[mins.length-1], worked, breaks, paidBreaks: para, snack,
               open, plan, over, nv:(nvFill>0), dovMin: dovUsed, kd, seg:true,
               segTypes: { prace:work>0, nahradni:nv>0, paragraf:para>0, dovolena:dov>0, svatek:svatek>0, nemoc:nemoc>0 },
               punches: arr };
    }

    let breaks = 0, paidBreaks = 0, nvBreaks = 0, dovBreaks = 0;
    for(let i=0;i<arr.length-1;i++){
      if(kinds[i]==='out' && kinds[i+1]==='in'){
        const g = mins[i+1]-mins[i];
        if(arr[i].paid) paidBreaks += g;        // §paragraf (přerušení)
        else if(arr[i].nv) nvBreaks += g;       // náhradní volno (přerušení)
        else if(arr[i].dov) dovBreaks += g;     // dovolená (přerušení)
        else breaks += g;                       // neplacené přerušení → odečítá se
      }
    }
    let end;
    if(open){ let n=nowMin(); while(n < mins[mins.length-1]) n += 1440; end = n; }
    else end = mins[mins.length-1];
    const hasOwn = day && day.brk != null;                    // má den vlastní údaj o svačině?
    const snackMin = hasOwn ? day.brk : breakMinutes();        // jinak vezmi aktuální nastavení
    const isPaid   = hasOwn ? !!day.paid : paidEl.checked;

    // čistá práce = přítomnost − neplacená přerušení − §paragraf − NV − dovolená
    const workBefore = Math.max(0, end - start - breaks - paidBreaks - nvBreaks - dovBreaks);
    // svačina se odečítá jen když je čistá práce nad 6 h a není placená (zákoník práce)
    const snack = (!isPaid && workBefore > 360) ? snackMin : 0;
    const actualWork = Math.max(0, workBefore - snack);
    const last = arr[arr.length-1];
    const finalPara = !open && last.k === 'out' && !!last.paid;   // § na posledním odchodu = zbytek směny paragraf
    const finalNV   = !open && last.k === 'out' && !!last.nv;     // NV na posledním odchodu = zbytek náhradní volno
    const finalDov  = !open && last.k === 'out' && !!last.dov;    // D na posledním odchodu = zbytek dovolená

    let paraTotal = paidBreaks;
    let dovTotal = dovBreaks;
    let over = null;
    let nvFill = nvBreaks;                       // NV přerušení se počítají jako odpracováno
    if(plan != null){
      let deficit = Math.max(0, plan - actualWork);
      let credit = Math.min(paidBreaks, deficit); deficit -= credit;   // §přerušení zaplní plán
      let dcredit = Math.min(dovBreaks, deficit); deficit -= dcredit;  // dovolená přerušení zaplní plán
      if(finalPara && deficit > 0){ paraTotal += deficit; credit += deficit; deficit = 0; }      // zbytek = paragraf
      else if(finalDov && deficit > 0){ dovTotal += deficit; dcredit += deficit; deficit = 0; }  // zbytek = dovolená
      over = actualWork + credit + dcredit - plan;              // § i dovolená plní plán (netvoří přesčas)
      if(finalNV && over < 0) nvFill += (-over);                // zbytek do plánu = náhradní volno
    }
    const worked = actualWork + nvFill;                          // NV se přičte do odpracováno (dovolená ne)
    return { start, end: open?null:mins[mins.length-1], worked, breaks, paidBreaks: paraTotal, snack, open, plan, over, nv: (nvFill > 0), dovMin: dovTotal, punches: arr };
  }

  // klíč aktivní směny (i přes půlnoc); null = žádná aktivní
  function activeShiftKey(store){
    // ber jen dny se směnou (píchnutími); celodenní typy (dovolená, svátek…) přeskoč
    const keys = Object.keys(store).filter(k => store[k] && store[k].punches && store[k].punches.length).sort();
    if(!keys.length) return null;
    const k = keys[keys.length-1];
    const arr = store[k].punches;
    let mins = arr.map(p => toMin(p.t));
    for(let i=1;i<mins.length;i++){ while(mins[i] < mins[i-1]) mins[i] += 1440; }
    const lastTs = new Date(k + 'T00:00:00').getTime() + mins[mins.length-1]*60000;
    const gapH = (Date.now() - lastTs) / 3600000;
    if(arr[arr.length-1].k === 'in') return gapH < 18 ? k : null;  // otevřená směna klidně přes půlnoc
    return gapH < 6 ? k : null;                                     // krátká pauza → návrat = přerušení
  }
  function currentKey(store){ return activeShiftKey(store) || ymd(new Date()); }

  function addPunch(kind){
    const store = loadPunch();
    let key = activeShiftKey(store);                 // pokračuj v aktivní směně (i přes půlnoc)
    if(key === null){
      if(kind === 'out'){ toast('Nejsi přihlášen(a)'); return; }
      key = ymd(new Date());                         // nová směna začíná dnes
    }
    let day = store[key];
    if(!day || !day.punches){ day = { punches: [], plan: workMin }; }   // nová směna (přebije i celodenní typ)
    const arr = day.punches;
    const last = arr[arr.length-1];
    if(kind==='in'  && last && last.k==='in'){ toast('Už jsi přihlášen(a)'); return; }
    if(kind==='out' && (!last || last.k==='out')){ toast('Nejsi přihlášen(a)'); return; }
    const d = new Date();
    arr.push({ t: pad(d.getHours()) + ':' + pad(d.getMinutes()), k: kind });
    day.plan = workMin;                              // plánovaná délka směny
    day.brk  = breakMinutes();                       // délka svačiny (min)
    day.paid = paidEl.checked;                        // placená? → neodečítá se
    store[key] = day; savePunch(store);
    if(kind==='in' && arr.filter(p=>p.k==='in').length===1){   // první příchod = začátek směny
      startEl.value = arr[0].t; calc();
    }
    toast((kind==='in' ? 'Příchod ' : 'Odchod ') + arr[arr.length-1].t + ' zapsáno');
    renderStatus(); renderHistory();
  }

  function renderStatus(){
    const store = loadPunch();
    const today = store[ymd(new Date())];

    const s = daySummary(store[currentKey(store)], currentKey(store));
    if(s && s.special){
      statusTxt.innerHTML = 'Dnes: <b>' + (TYPE_LABELS[s.type] || s.type) + '</b>';
      inBtn.disabled = false; outBtn.disabled = true;
      return;
    }
    if(!s){ statusTxt.textContent = 'Dnes nezaznamenáno'; inBtn.disabled=false; outBtn.disabled=true; return; }
    if(s.open){
      const off = s.breaks + s.snack;
      statusTxt.innerHTML = 'V práci od <b>' + hhmm(s.start) + '</b> · odpracováno <b>' + dur(s.worked) + '</b>'
        + (off ? ' · pauza ' + dur(off) : '');
      inBtn.disabled = true; outBtn.disabled = false;
    } else {
      let txt = 'Konec <b>' + hhmm(s.end) + '</b> · odpracováno <b>' + dur(s.worked) + '</b>';
      if(s.over != null) txt += ' · přesčas <b class="' + diffClass(s.over) + '">' + sdur(s.over) + '</b>';
      statusTxt.innerHTML = txt;
      inBtn.disabled = false; outBtn.disabled = true;
    }
  }

  function fmtDate(k){ return k.slice(8,10) + '.' + k.slice(5,7) + '.'; }
  const MONTHS = ['leden','únor','březen','duben','květen','červen','červenec','srpen','září','říjen','listopad','prosinec'];
  const MONTHS_GEN = ['ledna','února','března','dubna','května','června','července','srpna','září','října','listopadu','prosince'];
  function monthLabel(y,m){ return MONTHS[m] + ' ' + y; }

  function dowLabel(k){

    if(type === 'dovolena'){
      return '<span class="badge ico b-dov"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">' +
        '<g fill="#ffd21f"><circle cx="12" cy="12" r="4.2"/>' +
        '<g stroke="#ffd21f" stroke-width="1.8" stroke-linecap="round">' +
        '<path d="M12 2.6v2.6M12 18.8v2.6M2.6 12h2.6M18.8 12h2.6M5.3 5.3l1.9 1.9M16.8 16.8l1.9 1.9M18.7 5.3l-1.9 1.9M7.2 16.8l-1.9 1.9"/>' +
        '</g></g></svg></span>';
    }
    if(type === 'svatek'){
      return '<span class="badge ico b-sva"><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true">' +

        '<rect x="1.6" y="3.2" width="16.8" height="15.2" rx="2.2"/>' +
        '<path d="M1.6 7.4h16.8"/><path d="M6 1.4v3M14 1.4v3"/></g>' +
        '<path d="M5.6 12.4l3 3 6-6.2" fill="none" stroke="#43c67d" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>' +
        '</svg></span>';
    }
    const m = { paragraf:['§','b-para'], nahradni:['NV','b-nv'], pulden:['½','b-pul'] };
    const b = m[type]; return b ? '<span class="badge ' + b[1] + '">' + b[0] + '</span>' : '';
  }

  function renderList(){
    sheetTitle.textContent = 'Historie';
    totalsEl.style.display = '';
    viewActions.hidden = false; editActions.hidden = true;
    addDayBtn.hidden = false;

    const now = new Date();
    if(!histMonth) histMonth = { y: now.getFullYear(), m: now.getMonth() };
    const { y, m } = histMonth;

    const store = loadPunch();
    const items = Object.keys(store).sort().reverse()
      .map(k => ({ k, s: daySummary(store[k], k) })).filter(x => x.s);

    // listování jen po měsících se záznamem (+ aktuální měsíc je vždy dostupný)
    const curRealKey = now.getFullYear() + '-' + pad(now.getMonth()+1);
    const reachMonths = [...new Set([...Object.keys(store).map(k => k.slice(0,7)), curRealKey])].sort();
    const curKey = y + '-' + pad(m+1);
    const atMin = !reachMonths.some(mm => mm < curKey);
    const atMax = !reachMonths.some(mm => mm > curKey);

    const inMonth = items.filter(({k}) => {
      const d = new Date(k + 'T00:00:00');
      return d.getFullYear() === y && d.getMonth() === m;
    });

    let mWork = 0, mOver = 0;
    inMonth.forEach(({s}) => { if(s.open || s.neutral) return; mWork += s.worked; if(s.over!=null) mOver += s.over; });

    // konto (NV banka): klasická směna přispívá celým přesčasem;
    // zkrácená 6h jen prací nad plnou směnu (8h), odchod dřív z konta neubere
    const FULL_SHIFT = 480;
    function kontoDelta(s){
      if(s.neutral || s.over == null) return 0;
      if(s.type === 'nahradni' || s.type === 'pulden') return s.over;   // NV / půlden čerpá konto
      if(s.seg) return s.kd || 0;                                       // úsekový den: předpočítané konto
      const plan = s.plan; if(plan == null) return 0;
      const base = s.over + plan;                         // actualWork + paragraf credit
      if(plan <= 360) return Math.max(0, base - FULL_SHIFT);  // zkrácená → jen nad 8h
      return s.over;                                      // klasická → celý přesčas
    }

    // konto ke konci měsíce = základní snímek (nejbližší předchozí) + příspěvky dnů od data snímku
    const kontoSnaps = loadKontoSnaps();
    const kBase = baseSnap(kontoSnaps, y, m);
    const endKey = y + '-' + pad(m+1) + '-31';
    let konto = kBase.m;
    items.forEach(({k,s}) => {
      if(s.open) return;
      if(k >= kBase.d && k <= endKey) konto += kontoDelta(s);
    });

    // dovolená = základní snímek − vyčerpáno od data snímku; rezervace = budoucí čerpání do dalšího snímku
    const dovSnaps = loadDovSnaps();
    const dBase = baseSnap(dovSnaps, y, m);
    const dNext = nextSnapDate(dovSnaps, dBase.d);   // datum dalšího snímku (reset), nebo null
    let dovUsedMin = 0, dovFutureMin = 0;
    items.forEach(({k,s}) => {
      const dm = s.dovMin || 0; if(!dm) return;
      if(k < dBase.d) return;                        // patří pod dřívější snímek
      if(dNext && k >= dNext) return;                // patří pod pozdější snímek (reset)
      if(k <= endKey) dovUsedMin += dm;
      else dovFutureMin += dm;                       // budoucí čerpání v rámci tohoto snímku
    });
    const perDay = workMin || 360;                 // hodin/den dle nastavené směny
    const dovBal = dBase.m - dovUsedMin;            // zbývá ke konci zobrazeného měsíce (min)
    const dovRes = dovFutureMin;                    // rezervace = dovolená naplánovaná dál
    const dovFuture = dovFutureMin;                 // (pro podmínku zobrazení)
    const dovRest = dovBal - dovRes;                // zbytek po vyčerpání všeho zadaného
    const hm = m2 => (m2 < 0 ? '−' : '') + Math.round(Math.abs(m2)/60) + ' h';   // dovolená jen v celých hodinách
    const fmtDov = mm => (mm/perDay).toFixed(1).replace('.', ',') + ' dní · ' + hm(mm);
    const days = (dovBal / perDay).toFixed(1).replace('.', ',');
    const dovCls = dovBal < 0 ? 'neg' : (dovBal > 0 ? 'pos' : 'zero');

    totalsEl.innerHTML =
      '<div class="month-nav">' +
        '<button type="button" class="mnav" data-dir="-1" aria-label="Předchozí měsíc"' + (atMin?' disabled':'') + '><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>' +
        '<div class="mlabel">' + monthLabel(y,m) + '</div>' +
        '<button type="button" class="mnav" data-dir="1" aria-label="Další měsíc"' + (atMax?' disabled':'') + '><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>' +
      '</div>' +
      '<div class="totals-cards">' +
        '<div class="tot"><div class="k">Odpracováno</div><div class="v">' + dur(mWork) + '</div></div>' +
        '<div class="tot"><div class="k">Přesčas</div><div class="v ' + diffClass(mOver) + '">' + sdur(mOver) + '</div></div>' +
      '</div>' +
      '<div class="konto-card">' +
        '<div class="konto-k">Konto</div>' +
        '<div class="konto-v ' + diffClass(konto) + '">' + sdur(konto) + '</div>' +
      '</div>' +
      '<div class="konto-card dov-card">' +
        '<div class="dov-head"><div class="konto-k">Dovolená</div>' +
          '<div class="konto-v dov-val ' + dovCls + '"><span class="dov-days">' + days + ' dní · </span>' + hm(dovBal) + '</div></div>' +
        (dovFuture > 0 ?
          '<div class="dov-sub"><span>Rezervace</span><span class="sub-neg">' + (dovRes/perDay).toFixed(1).replace('.', ',') + ' dní · −' + Math.round(dovRes/60) + ' h</span></div>' +
          '<div class="dov-sub"><span>Zbytek</span><span class="' + (dovRest < 0 ? 'sub-neg' : 'sub-pos') + '">' + fmtDov(dovRest) + '</span></div>'
          : '') +
      '</div>';

    if(!inMonth.length){ logListEl.innerHTML = '<div class="log-empty">V tomto měsíci žádné záznamy.</div>'; return; }
    logListEl.innerHTML = inMonth.map(({k,s}) => {
      const editBtn = '<button class="rec-edit" data-date="' + k + '" aria-label="Upravit">✎</button>';
      const delBtn  = '<button class="rec-del" data-date="' + k + '" aria-label="Smazat">✕</button>';

      if(s.special){
        const names = { paragraf:'Paragraf', nemoc:'Nemoc', dovolena:'Dovolená', svatek:'Svátek', nahradni:'Náhradní volno', pulden:'Půl dne' };
        if(s.type === 'pulden'){
          const hb = { prace:typeBadge('smena'), paragraf:typeBadge('paragraf'), dovolena:typeBadge('dovolena'), nahradni:typeBadge('nahradni') };
          const mid = (s.start!=null) ? hhmm(s.start + s.half) : '', st = (s.start!=null)?hhmm(s.start):'', en = (s.end!=null)?hhmm(s.end):'';
          const rng = (s.start!=null) ? (st + ' → ' + mid + ' → ' + en) : (HALF_LABELS[s.a] + ' + ' + HALF_LABELS[s.b]);
          const badges = (hb[s.a]||'') + (hb[s.b]||'');
          const right = '<span class="df ' + diffClass(s.over) + '">' + sdur(s.over) + '</span>';
          return '<div class="rec">' + editBtn + dowLabel(k) +
                 '<div class="rec-main"><div class="d">' + fmtDate(k) + ' <span class="d-sub">· půl dne</span></div>' +
                 '<div class="t">odpracováno ' + dur(s.worked) + '</div>' +
                 '<div class="t">' + rng + '</div></div>' +
                 '<div class="rec-actions"><span class="rec-badges">' + badges + '</span>' + right + delBtn + '</div></div>';
        }
        const right = (s.type === 'nahradni')
          ? '<span class="df ' + diffClass(s.over) + '">' + sdur(s.over) + '</span>'
          : '<span class="df zero">–</span>';
        const sub = (s.type === 'nahradni') ? ('odpracováno ' + dur(s.worked)) : 'celý den';
        return '<div class="rec">' + editBtn + dowLabel(k) +
               '<div class="rec-main"><div class="d">' + fmtDate(k) + '</div>' +
               '<div class="t">' + names[s.type] + ' · ' + sub + '</div></div>' +
               '<div class="rec-actions"><span class="rec-badges">' + typeBadge(s.type) + '</span>' + right + delBtn + '</div></div>';
      }

      const range = hhmm(s.start) + ' → ' + (s.open ? '<span class="live">běží</span>' : hhmm(s.end));
      const off = s.breaks + s.snack;
      const line3 = range + (off ? ' · pauza ' + dur(off) : '');
      const PLAN_NAME = { 360:'zkrácená', 480:'ranní', 450:'odpolední', 420:'noční' };
      const shiftName = PLAN_NAME[s.plan] ? ' <span class="d-sub">· ' + PLAN_NAME[s.plan] + '</span>' : '';
      let badges;
      if(s.seg){
        const order = ['prace','paragraf','nahradni','dovolena','svatek','nemoc'];
        const present = order.filter(t => s.segTypes[t]);
        const multi = present.length > 1;
        badges = present.map(t => (t==='prace' ? (multi ? typeBadge('smena') : '') : typeBadge(t))).join('');
      } else {
        badges = (s.paidBreaks ? typeBadge('paragraf') : '') + (s.nv ? typeBadge('nahradni') : '') + ((s.dovMin > 0) ? typeBadge('dovolena') : '');
      }
      const over = (s.open || s.over == null)
        ? '<span class="df zero">–</span>'
        : '<span class="df ' + diffClass(s.over) + '">' + sdur(s.over) + '</span>';
      return '<div class="rec">' + editBtn + dowLabel(k) +
             '<div class="rec-main"><div class="d">' + fmtDate(k) + shiftName + '</div>' +
             '<div class="t">odpracováno ' + dur(s.worked) + '</div>' +
             '<div class="t">' + line3 + '</div></div>' +
             '<div class="rec-actions"><span class="rec-badges">' + badges + '</span>' + over + delBtn + '</div></div>';
    }).join('');
  }

  function brkToStr(min){ return pad(Math.floor(min/60)) + ':' + pad(min%60); }

  function plansHtml(){
    const plans = [[360,'6','zkrácená'],[480,'8','ranní'],[450,'7:30','odpolední'],[420,'7:00','noční']];
    return plans.map(([m,l,c]) =>
      '<button type="button" class="plan-btn ' + (editPlan===m?'on':'') + '" data-plan="' + m + '">' +
        '<span class="ph">' + l + '</span><span class="pc">' + c + '</span></button>').join('');

    return editArr.map((p,i) =>
      '<div class="edit-row" data-idx="' + i + '">' +
        '<button type="button" class="type-toggle ' + (p.k==='in'?'in':'out') + '" data-idx="' + i + '">' +
          (p.k==='in' ? 'Příchod' : 'Odchod') + '</button>' +
        '<input type="time" class="edit-time" data-idx="' + i + '" value="' + p.t + '">' +
        '<button type="button" class="row-del" data-idx="' + i + '" aria-label="Smazat">✕</button>' +

    const icons = ['paragraf','dovolena','nahradni','svatek','nemoc'].map(t =>
      '<button type="button" class="fill-btn' + (editFill===t?' on':'') + '" data-fill="' + t + '" title="' + TYPE_LABELS[t] + '">' + typeBadge(t) + '</button>'
    ).join('');
    return '<div class="edit-lbl">Zbytek do plné směny</div>' +
      '<div class="fill-pick">' + none + icons + '</div>';

  function renderEdit(){
    sheetTitle.textContent = editDate ? ('Úprava ' + fmtDate(editDate)) : 'Nový záznam';
    totalsEl.style.display = 'none';
    viewActions.hidden = true; editActions.hidden = false;
    addDayBtn.hidden = true;

    const typeOrder = ['smena','paragraf','nemoc','dovolena','svatek','nahradni'];
    const typeGrid = typeOrder.map(t =>
      '<button type="button" class="type-opt' + (editType===t?' on':'') + '" data-type="' + t + '">' +
        '<span class="type-opt-ic">' + typeBadge(t) + '</span>' +
        '<span class="type-opt-l">' + TYPE_LABELS[t] + '</span>' +

    let html =
      '<div class="edit-lbl">Typ dne</div>' +
      '<div class="type-grid">' + typeGrid + '</div>' +
      '<div class="edit-lbl">Datum</div>' +
