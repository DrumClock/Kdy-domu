<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Osobní píchačka</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c1726">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Píchačka">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#1c1726;
    --panel:#251d33;
    --line:#3a2f4d;
    --ink:#efe9df;
    --muted:#9a8fae;
    --amber:#ffb020;
    --amber-dim:#7a5410;
    --glow:rgba(255,176,32,.28);
    --red:#ff5c6c;
    --green:#43c67d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    background:
      radial-gradient(120% 80% at 50% -10%, #2a2138 0%, var(--bg) 60%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    overflow-y:auto;
    padding:calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
  }
  .card{
    width:100%;
    max-width:460px;
    margin:auto;
    position:relative;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:20px;
    padding:34px 30px 30px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.6);
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--amber);
    font-weight:600;
    margin-bottom:6px;
    text-align:center;
  }
  h1{
    font-size:26px;
    font-weight:700;
    letter-spacing:-.01em;
    margin-bottom:26px;
    text-align:center;
  }
  label{
    display:block;
    font-size:13px;
    color:var(--muted);
    margin-bottom:9px;
    letter-spacing:.02em;
  }
  .field{margin-bottom:22px}
  input[type="time"]{
    width:100%;
    background:#161020;
    border:1px solid var(--line);
    border-radius:12px;
    color:var(--ink);
    font-size:22px;
    font-family:"SFMono-Regular","Consolas",monospace;
    padding:14px 16px;
    letter-spacing:.06em;
  }
  input[type="time"]:focus,
  .seg button:focus-visible,
  input[type="time"]:focus-visible{
    outline:2px solid var(--amber);
    outline-offset:2px;
  }
  input[type="time"]::-webkit-calendar-picker-indicator{filter:invert(.7)}

  .seg-group{display:flex;flex-direction:column;gap:14px}
  .seg-cap{
    display:block;
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:7px;
  }
  .seg{display:flex;gap:10px}
  .seg button{
    flex:1;
    background:#161020;
    border:1px solid var(--line);
    border-radius:12px;
    color:var(--muted);
    font-size:16px;
    font-weight:600;
    padding:15px 0;
    cursor:pointer;
    transition:border-color .15s, color .15s, background .15s;
  }
  .seg button:hover{border-color:#5a4a76}
  .seg button.active{
    background:var(--amber);
    border-color:var(--amber);
    color:#1c1726;
  }
  .seg button .h{display:block;font-size:19px;line-height:1}
  .seg button .t{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:4px;opacity:.75}

  .row{display:flex;gap:14px;align-items:flex-end}
  .row .field{flex:1;margin-bottom:0}

  .check{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:16px;
    cursor:pointer;
    user-select:none;
    font-size:14px;
    color:var(--ink);
  }
  .check input{position:absolute;opacity:0;width:0;height:0}
  .box{
    width:44px;
    height:26px;
    border-radius:999px;
    background:#161020;
    border:1px solid var(--line);
    position:relative;
    flex:none;
    transition:background .15s,border-color .15s;
  }
  .box::after{
    content:"";
    position:absolute;
    top:3px;left:3px;
    width:18px;height:18px;
    border-radius:50%;
    background:var(--muted);
    transition:transform .15s,background .15s;
  }
  .check input:checked + .box{background:var(--amber);border-color:var(--amber)}
  .check input:checked + .box::after{transform:translateX(18px);background:#1c1726}
  .check input:focus-visible + .box{outline:2px solid var(--amber);outline-offset:2px}
  .check .state{color:var(--muted);font-size:13px}

  .display{
    margin-top:26px;
    background:#120d1c;
    border:1px solid var(--line);
    border-radius:16px;
    padding:26px 20px 22px;
    text-align:center;
  }
  .display .lbl{
    font-size:12px;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:10px;
  }
  .clock{
    font-family:"SFMono-Regular","Consolas",monospace;
    font-size:64px;
    font-weight:700;
    letter-spacing:.05em;
    color:var(--amber);
    text-shadow:0 0 22px var(--glow);
    line-height:1;
  }
  .breakdown{
    margin-top:18px;
    font-size:13px;
    color:var(--muted);
    line-height:1.7;
  }
  .breakdown b{color:var(--ink);font-weight:600}

  .now-lbl{
    margin-top:16px;
    padding-top:16px;
    border-top:1px solid var(--line);
    font-size:12px;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--muted);
    text-align:center;
    margin-bottom:8px;
    min-height:15px;
  }
  .now{
    text-align:center;
    font-family:"SFMono-Regular","Consolas",monospace;
    font-weight:700;
    font-size:28px;
    letter-spacing:.05em;
    min-height:34px;
  }
  .now.over{ color:var(--green); }
  .now.left{ color:var(--red); }

  /* akční tlačítka pod výsledkem */
  .actions{ display:flex; gap:10px; margin-top:2px; }
  .punch{ display:flex; gap:10px; margin-top:2px; }
  .punch-btn{
    flex:1; padding:13px 10px; border:none; border-radius:12px;
    font-size:16px; font-weight:700; cursor:pointer; color:#1c1726;
  }
  .punch-btn.in{ background:var(--green); }
  .punch-btn.out{ background:var(--red); }
  .punch-btn:disabled{ opacity:.38; cursor:default; }
  .punch-bar{ display:flex; align-items:center; justify-content:center; gap:10px; margin-top:2px; }
  .status-txt{ font-size:12.5px; color:var(--muted); line-height:1.4; }
  .status-txt b{ color:var(--ink); font-weight:600; }
  .status-txt .pos{ color:var(--green); } .status-txt .neg{ color:var(--red); } .status-txt .zero{ color:var(--muted); }
  .link-btn{ background:transparent; border:none; color:var(--amber); font-size:13px; font-weight:600; cursor:pointer; padding:4px 2px; flex:none; }
  .act-btn{
    flex:1;
    padding:11px 10px;
    border-radius:12px;
    border:1px solid var(--line);
    background:#161020;
    color:var(--ink);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .act-btn:active{ border-color:#5a4a76; }
  .act-btn.primary{ background:var(--amber); border-color:var(--amber); color:#1c1726; }
  .act-btn.danger{ color:var(--red); }

  /* panel Historie */
  .sheet{
    position:fixed; inset:0; z-index:10;
    background:rgba(12,9,18,.72);
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
    display:flex; align-items:stretch; justify-content:center;
  }
  .sheet[hidden]{ display:none; }
  .sheet-inner{
    width:100%; max-width:460px; height:100dvh;
    display:flex; flex-direction:column; overflow:hidden;
    background:var(--panel); border-left:1px solid var(--line); border-right:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 18px);
  }
  .sheet-head, .totals, .sheet-actions{ flex:none; }
  .sheet-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .sheet-head h2{ font-size:18px; font-weight:700; }
  .sheet-close{ background:transparent; border:none; color:var(--muted); font-size:18px; cursor:pointer; padding:4px 8px; }
  .head-actions{ display:flex; align-items:center; gap:6px; }
  .head-btn{ background:transparent; border:1px solid var(--line); border-radius:9px; color:var(--amber);
    font-size:18px; line-height:1; cursor:pointer; padding:4px 11px; }
  .head-btn:active{ border-color:#5a4a76; }
  .edit-lbl{ font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:2px 0 6px; }
  .edit-date{ width:100%; padding:9px 10px; font-size:16px; margin-bottom:14px; }
  .edit-brk-row{ display:flex; gap:8px; margin-bottom:14px; }
  .edit-brk-row .edit-brk{ flex:1; min-width:0; padding:9px 10px; font-size:16px; }
  .paid-toggle{ flex:none; padding:9px 16px; border-radius:10px; border:none;
    font-weight:700; font-size:13px; cursor:pointer; color:#1c1726; }
  .paid-toggle.paid{ background:var(--green); }
  .paid-toggle.unpaid{ background:var(--red); }
  .totals{ display:flex; gap:10px; margin-bottom:14px; }
  .tot{ flex:1; background:#161020; border:1px solid var(--line); border-radius:12px; padding:12px; text-align:center; }
  .tot .k{ font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .tot .v{ font-family:"SFMono-Regular","Consolas",monospace; font-size:20px; font-weight:700; margin-top:4px; }
  .tot .sub{ font-size:11px; font-weight:600; margin-top:3px; }
  .tot .sub.pos{ color:var(--green); } .tot .sub.neg{ color:var(--red); } .tot .sub.zero{ color:var(--muted); }
  .live{ color:var(--amber); font-weight:600; font-size:11px; }
  .log{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; flex:1 1 auto; overflow-y:auto; min-height:80px; }
  .log-empty{ color:var(--muted); font-size:14px; text-align:center; padding:16px 0; }
  .rec{ display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:#161020; border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .rec .d{ font-size:13px; color:var(--ink); font-weight:600; }
  .rec .t{ font-size:12px; color:var(--muted); margin-top:2px; }
  .rec-actions{ display:flex; align-items:center; gap:4px; }
  .rec .df{ font-family:"SFMono-Regular","Consolas",monospace; font-weight:700; font-size:15px; margin-right:2px; }
  .df.pos{ color:var(--green); } .df.neg{ color:var(--red); } .df.zero{ color:var(--muted); }
  .rec-edit, .rec-del{ background:transparent; border:none; color:var(--muted); cursor:pointer; font-size:14px; padding:3px 5px; }
  .rec-edit:active, .rec-del:active{ color:var(--ink); }

  /* editace záznamu */
  .edit-head{ font-size:12.5px; color:var(--muted); margin-bottom:12px; line-height:1.4; }
  .edit-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .type-toggle{ flex:none; width:92px; padding:9px 6px; border-radius:10px; border:none;
    font-weight:700; font-size:13px; cursor:pointer; color:#1c1726; }
  .type-toggle.in{ background:var(--green); } .type-toggle.out{ background:var(--red); }
  .edit-row .edit-time{ flex:1; min-width:0; padding:9px 10px; font-size:16px; }
  .row-del{ flex:none; background:transparent; border:1px solid var(--line); border-radius:8px;
    color:var(--muted); font-size:14px; cursor:pointer; padding:6px 9px; }
  .para-toggle{ flex:none; background:transparent; border:1px solid var(--line); border-radius:8px;
    color:var(--muted); font-weight:700; font-size:15px; cursor:pointer; padding:6px 11px; }
  .para-toggle.on{ background:var(--green); border-color:var(--green); color:#1c1726; }
  .add-punch{ margin-top:4px; }
  .sheet-actions{ display:flex; gap:10px; }
  .sheet-actions[hidden]{ display:none; }

  .toast{
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 24px);
    transform:translateX(-50%); z-index:20;
    background:#161020; border:1px solid var(--line); border-radius:999px;
    color:var(--ink); font-size:14px; font-weight:600; padding:10px 18px;
    box-shadow:0 12px 30px -10px rgba(0,0,0,.6); max-width:90vw; text-align:center;
  }
  .toast[hidden]{ display:none; }
  .foot{
    margin-top:18px;
    font-size:12px;
    color:var(--muted);
    text-align:center;
  }
  @media (prefers-reduced-motion:no-preference){
    .clock{transition:opacity .2s}
  }

  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
  }
  .corner-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    line-height:0;
    color:var(--muted);
    padding:8px;
    border-radius:12px;
    border:1px solid var(--line);
    background:rgba(22,15,32,.55);
    -webkit-backdrop-filter:blur(4px);
    backdrop-filter:blur(4px);
    cursor:pointer;
  }
  .corner-btn:active{color:var(--amber);border-color:#5a4a76}
  .corner-btn:disabled{opacity:.35;cursor:default}
  .corner-btn:disabled:active{color:var(--muted);border-color:var(--line)}

  .start-row{
    display:flex;
    gap:10px;
    align-items:stretch;
  }
  .start-row input[type="time"]{
    flex:1;
    min-width:0;
  }
  .now-btn{
    flex:0 0 auto;
    padding:0 24px;
    border:none;
    border-radius:12px;
    background:var(--amber);
    color:#1c1726;
    font-size:16px;
    font-weight:700;
    letter-spacing:.02em;
    cursor:pointer;
  }
  .now-btn:active{filter:brightness(.93)}

  /* --- Mobil: celá obrazovka bez scrollování --- */
  @media (max-width:520px){
    body{
      padding:0;
      align-items:stretch;
      overflow-y:auto;               /* když se nevejde, radši doscrolluj než ořízni */
    }
    .card{
      max-width:none;
      margin:0;
      min-height:100dvh;
      border:none;
      border-radius:0;
      box-shadow:none;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;    /* obsah odshora – žádná velká mezera nahoře */
      gap:clamp(7px,1.5vh,16px);
      padding:calc(env(safe-area-inset-top) + 10px)
              calc(env(safe-area-inset-right) + 20px)
              calc(env(safe-area-inset-bottom) + 14px)
              calc(env(safe-area-inset-left) + 20px);
    }
    /* zruš pevné spodní mezery – rozestupy řeší gap na kartě */
    h1{margin-bottom:0;font-size:clamp(20px,5.2vw,26px)}
    .field{margin-bottom:0}
    label{margin-bottom:6px}
    .seg-group{gap:clamp(7px,1.3vh,14px)}
    .seg-cap{margin-bottom:5px}
    input[type="time"]{padding:clamp(8px,1.2vh,13px) 16px;font-size:19px}
    .seg button{padding:clamp(8px,1.3vh,14px) 0}
    .seg button .h{font-size:17px}
    .now-btn{padding:0 20px;font-size:15px}
    .check{margin-top:clamp(7px,1.2vh,14px)}
    .display{margin-top:0;padding:clamp(12px,2vh,22px) 18px}
    .clock{font-size:clamp(34px,11vw,58px)}
    .now-lbl{margin-top:clamp(8px,1.3vh,14px);padding-top:clamp(8px,1.3vh,14px)}
    .now{font-size:clamp(18px,6vw,26px)}
    .act-btn{padding:10px 8px;font-size:13px}
    .punch-btn{padding:12px 8px;font-size:15px}
    .status-txt{font-size:12px}
  }
</style>
</head>
<body>
  <main class="card">
    <div class="toolbar">
      <button class="corner-btn" id="calBtn" type="button"
              aria-label="Přidat připomínku do kalendáře" title="Připomínka v kalendáři">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M7 2h2v2h6V2h2v2h1a2 2 0 0 1 2 2v2H4V6a2 2 0 0 1 2-2h1V2z"/>
          <path d="M4 10h16v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-9zm3 3v2h2v-2H7zm4 0v2h2v-2h-2zm4 0v2h2v-2h-2z"/>
        </svg>
      </button>

      <button class="corner-btn" id="histBtn" type="button" aria-label="Historie" title="Historie">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M13 3a9 9 0 1 0 8.94 10H19.9A7 7 0 1 1 13 5a6.9 6.9 0 0 1 4.9 2.05L15 10h7V3l-2.6 2.6A9 9 0 0 0 13 3z"/>
          <path d="M12 8h1.6v4.3l3.2 1.9-.8 1.35L12 13.2z"/>
        </svg>
      </button>

      <a class="corner-btn" href="napoveda.html" aria-label="Nápověda" title="Nápověda">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 3.4a3.6 3.6 0 0 1 3.6 3.6c0 1.9-1.3 2.6-2.2 3.2-.6.4-1 .7-1 1.3v.4h-1.9v-.6c0-1.5 1-2.2 1.8-2.7.7-.5 1.2-.8 1.2-1.6a1.7 1.7 0 0 0-3.4 0H8.4A3.6 3.6 0 0 1 12 5.4zM11 16.2h2v2h-2z"/>
        </svg>
      </a>

      <a class="corner-btn" href="sdilet.html" aria-label="Sdílet appku (QR kód)" title="Sdílet · QR">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M3 3h7v7H3V3zm2 2v3h3V5H5z"/>
          <path d="M14 3h7v7h-7V3zm2 2v3h3V5h-3z"/>
          <path d="M3 14h7v7H3v-7zm2 2v3h3v-3H5z"/>
          <path d="M14 14h2v2h-2zM18 14h3v2h-3zM16 16h2v2h-2zM14 18h2v3h-2zM18 18h3v3h-3z"/>
        </svg>
      </a>
    </div>

    <h1>Osobní píchačka</h1>

    <div class="punch">
      <button type="button" class="punch-btn in" id="inBtn">Příchod</button>
      <button type="button" class="punch-btn out" id="outBtn">Odchod</button>
    </div>
    <div class="punch-bar">
      <span class="status-txt" id="statusTxt"></span>
    </div>

    <div class="display">
      <div class="lbl">Odchod domů</div>
      <div class="clock" id="result" aria-live="polite">–:–</div>
      <div class="breakdown" id="breakdown"></div>
      <div class="now-lbl" id="nowLbl"></div>
      <div class="now" id="now"></div>
    </div>

    <div class="field">
      <label for="start">Začátek směny</label>
      <input type="time" id="start">
    </div>

    <div class="field">
      <label>Pracovní doba</label>
      <div class="seg-group" id="seg" role="group" aria-label="Pracovní doba">
        <div class="seg-block">
          <span class="seg-cap">Zkrácená</span>
          <div class="seg">
            <button type="button" data-min="360"><span class="h">6</span><span class="t">hodin</span></button>
          </div>
        </div>
        <div class="seg-block">
          <span class="seg-cap">Klasická</span>
          <div class="seg">
            <button type="button" data-min="480"><span class="h">8</span><span class="t">ranní</span></button>
            <button type="button" data-min="450"><span class="h">7:30</span><span class="t">odpolední</span></button>
            <button type="button" data-min="420"><span class="h">7:00</span><span class="t">noční</span></button>
          </div>
        </div>
      </div>
    </div>

    <div class="field">
      <label for="brk">Svačina</label>
      <input type="time" id="brk" value="00:30">
      <label class="check" for="paid">
        <input type="checkbox" id="paid">
        <span class="box"></span>
        <span>Placená pauza <span class="state" id="paidState">(neplacená → přičítá se)</span></span>
      </label>
    </div>
  </main>

  <div class="sheet" id="history" hidden>
    <div class="sheet-inner">
      <div class="sheet-head">
        <h2 id="sheetTitle">Historie</h2>
        <div class="head-actions">
          <button type="button" class="head-btn" id="addDayBtn" aria-label="Přidat den" title="Přidat den">＋</button>
          <button type="button" class="sheet-close" id="histClose" aria-label="Zavřít">✕</button>
        </div>
      </div>
      <div class="totals" id="totals"></div>
      <div class="log" id="logList"></div>
      <div class="sheet-actions" id="viewActions">
        <button type="button" class="act-btn" id="csvBtn">Export</button>
        <button type="button" class="act-btn danger" id="clearBtn">Vymazat vše</button>
      </div>
      <div class="sheet-actions" id="editActions" hidden>
        <button type="button" class="act-btn primary" id="saveEditBtn">Uložit</button>
        <button type="button" class="act-btn" id="cancelEditBtn">Zrušit</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

<script>
  const startEl = document.getElementById('start');
  const segEl   = document.getElementById('seg');
  const brkInput= document.getElementById('brk');
  const paidEl  = document.getElementById('paid');
  const paidTxt = document.getElementById('paidState');
  const resEl   = document.getElementById('result');
  const brkEl   = document.getElementById('breakdown');
  const nowEl   = document.getElementById('now');
  const nowLbl  = document.getElementById('nowLbl');
  const calBtn  = document.getElementById('calBtn');
  let workMin = 480;   // ← výchozí doba v minutách (360=6h, 420=7:00, 450=7:30, 480=8h)
  let startTotal = null;  // začátek v minutách od půlnoci
  let endTotal   = null;  // odchod v minutách od půlnoci (může přesáhnout 1440)

  function pad(n){ return String(n).padStart(2,'0'); }

  function syncSeg(){
    segEl.querySelectorAll('button').forEach(b =>
      b.classList.toggle('active', Number(b.dataset.min) === workMin));
  }

  function breakMinutes(){
    const v = brkInput.value;
    if(!v) return 0;
    const [h, m] = v.split(':').map(Number);
    return h*60 + m;
  }

  function calc(){
    const v = startEl.value;
    if(!v){
      resEl.textContent = '–:–';
      brkEl.textContent = '';
      nowEl.textContent = '';
      startTotal = endTotal = null;
      if(calBtn) calBtn.disabled = true;
      return;
    }

    const [sh, sm] = v.split(':').map(Number);
    const brk  = breakMinutes();
    const paid = paidEl.checked;
    // placená pauza se počítá jako práce → do odchodu se nepřičítá
    const addBreak = paid ? 0 : brk;

    startTotal = sh*60 + sm;
    const total = startTotal + workMin + addBreak;   // minuty od půlnoci
    endTotal = total;
    const endMin = ((total % 1440) + 1440) % 1440;    // ošetření přes půlnoc
    const eh = Math.floor(endMin / 60);
    const em = endMin % 60;

    const workLbl = pad(Math.floor(workMin/60)) + ':' + pad(workMin%60);
    paidTxt.textContent = paid ? '(placená → nepřičítá se)' : '(neplacená → přičítá se)';

    resEl.textContent = pad(eh) + ':' + pad(em);
    brkEl.innerHTML =
      'Začátek <b>' + pad(sh) + ':' + pad(sm) + '</b> + '
      + '<b>' + workLbl + '</b> práce'
      + (paid
          ? ' <span style="opacity:.6">(pauza ' + pad(Math.floor(brk/60)) + ':' + pad(brk%60) + ' placená)</span>'
          : ' + <b>' + pad(Math.floor(brk/60)) + ':' + pad(brk%60) + '</b> pauza')
      + (total >= 1440 ? ' <b>(další den)</b>' : '');

    if(calBtn) calBtn.disabled = false;
    updateNow();
  }

  function updateNow(){
    if(endTotal === null){
      nowEl.textContent = ''; nowEl.className = 'now';
      nowLbl.textContent = '';
      return;
    }

    const d = new Date();
    let nowMin = d.getHours()*60 + d.getMinutes();
    // pokud odchod přetéká přes půlnoc a je zrovna po půlnoci, posuň "teď" na další den
    if(endTotal >= 1440 && nowMin < startTotal) nowMin += 1440;

    const diff = nowMin - endTotal;          // >0 přesčas, <0 zbývá
    const abs  = Math.abs(diff);
    const hhmm = pad(Math.floor(abs/60)) + ':' + pad(abs%60);

    if(diff < 0){                            // ještě pracuješ → zbývá, červeně
      nowLbl.textContent = 'Zbývá';
      nowEl.className = 'now left';
      nowEl.textContent = '-' + hhmm;
    } else {                                 // odchod nebo přesčas → zeleně
      nowLbl.textContent = 'Přesčas';
      nowEl.className = 'now over';
      nowEl.textContent = '+' + hhmm;
    }
  }

  segEl.addEventListener('click', e => {
    const btn = e.target.closest('button');
    if(!btn) return;
    workMin = Number(btn.dataset.min);
    syncSeg();
    saveSettings();
    calc();
  });

  // --- Začátek směny se odvozuje z prvního Příchodu (ruční zadání jen pro výpočet) ---
  function nowHHMM(){
    const d = new Date();
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  // při otevření vezmi začátek z prvního Příchodu aktivní směny (i přes půlnoc)
  function syncStartFromShift(){
    const store = loadPunch();
    const key = activeShiftKey(store);
    if(key && store[key].punches && store[key].punches.length){
      const firstIn = store[key].punches.find(p => p.k === 'in');
      if(firstIn) startEl.value = firstIn.t;
    }
    // žádná aktivní směna → pole zůstane prázdné, lze zadat ručně
  }

  // --- uložení pracovní doby a svačiny (trvalá předvolba) ---
  const SET_KEY = 'kdyDomu.settings';
  const WORK_OK = [360, 420, 450, 480];

  function saveSettings(){
    try{
      localStorage.setItem(SET_KEY, JSON.stringify({
        workMin: workMin,
        brk: brkInput.value,
        paid: paidEl.checked
      }));
    }catch(e){}
  }

  function loadSettings(){
    try{
      const raw = localStorage.getItem(SET_KEY);
      if(!raw) return;
      const s = JSON.parse(raw);
      if(WORK_OK.includes(s.workMin)) workMin = s.workMin;
      if(typeof s.brk === 'string' && /^\d{1,2}:\d{2}$/.test(s.brk)) brkInput.value = s.brk;
      if(typeof s.paid === 'boolean') paidEl.checked = s.paid;
    }catch(e){}
  }

  // --- připomínka do kalendáře (.ics) ---
  function icsLocal(dt){
    return dt.getFullYear() + pad(dt.getMonth()+1) + pad(dt.getDate())
      + 'T' + pad(dt.getHours()) + pad(dt.getMinutes()) + '00';
  }
  function icsUTC(dt){
    return dt.getUTCFullYear() + pad(dt.getUTCMonth()+1) + pad(dt.getUTCDate())
      + 'T' + pad(dt.getUTCHours()) + pad(dt.getUTCMinutes()) + pad(dt.getUTCSeconds()) + 'Z';
  }

  // stálé ID události + verze (SEQUENCE) → kalendář událost přepíše místo duplikace
  function eventMeta(){
    let meta = null;
    try{ meta = JSON.parse(localStorage.getItem('kdyDomu.evt') || 'null'); }catch(e){}
    if(!meta || !meta.uid){
      meta = { uid: 'kdydomu-' + Date.now() + '-' + Math.random().toString(36).slice(2,8) + '@drumclock.github.io', seq: 0 };
    } else {
      meta.seq = (meta.seq | 0) + 1;   // každý další export = vyšší verze
    }
    try{ localStorage.setItem('kdyDomu.evt', JSON.stringify(meta)); }catch(e){}
    return meta;
  }

  function buildICS(){
    // odchod jako reálné datum: dnešní půlnoc + endTotal minut (přeteče na další den samo)
    const base = new Date();
    const dep = new Date(base.getFullYear(), base.getMonth(), base.getDate(), 0, 0, 0, 0);
    dep.setMinutes(endTotal);
    const end = new Date(dep.getTime() + 15 * 60000);
    const meta = eventMeta();

    return [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//Kdy domu//CS',
      'CALSCALE:GREGORIAN',
      'METHOD:PUBLISH',
      'BEGIN:VEVENT',
      'UID:' + meta.uid,
      'SEQUENCE:' + meta.seq,
      'DTSTAMP:' + icsUTC(new Date()),
      'DTSTART:' + icsLocal(dep),
      'DTEND:' + icsLocal(end),
      'SUMMARY:Odchod domů 🏠',
      'DESCRIPTION:Konec směny – můžeš jít domů.',
      'BEGIN:VALARM',
      'ACTION:DISPLAY',
      'DESCRIPTION:Odchod domů',
      'TRIGGER;RELATED=START:PT0S',
      'END:VALARM',
      'END:VEVENT',
      'END:VCALENDAR'
    ].join('\r\n');
  }

  calBtn.addEventListener('click', () => {
    if(endTotal === null) return;
    const blob = new Blob([buildICS()], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'odchod-domu.ics';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  });

  // ===== Píchačky: příchod / odchod / přerušení =====
  const PUNCH_KEY = 'kdyDomu.punch';
  const inBtn    = document.getElementById('inBtn');
  const outBtn   = document.getElementById('outBtn');
  const histBtn  = document.getElementById('histBtn');
  const histEl   = document.getElementById('history');
  const histClose= document.getElementById('histClose');
  const totalsEl = document.getElementById('totals');
  const logListEl= document.getElementById('logList');
  const csvBtn   = document.getElementById('csvBtn');
  const clearBtn = document.getElementById('clearBtn');
  const toastEl  = document.getElementById('toast');
  const statusTxt= document.getElementById('statusTxt');
  const sheetTitle   = document.getElementById('sheetTitle');
  const viewActions  = document.getElementById('viewActions');
  const editActions  = document.getElementById('editActions');
  const saveEditBtn  = document.getElementById('saveEditBtn');
  const cancelEditBtn= document.getElementById('cancelEditBtn');
  const addDayBtn    = document.getElementById('addDayBtn');
  let editDate = null, editKey = null, editArr = null, editBrk = 30, editPaid = false;

  function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  function hhmm(min){ min=((min%1440)+1440)%1440; return pad(Math.floor(min/60)) + ':' + pad(min%60); }
  function dur(min){ const a=Math.abs(min); return (min<0?'-':'') + Math.floor(a/60) + ':' + pad(a%60); }
  function sdur(min){ const a=Math.abs(min); return (min<0?'-':'+') + Math.floor(a/60) + ':' + pad(a%60); }
  function diffClass(v){ return v>0 ? 'pos' : (v<0 ? 'neg' : 'zero'); }
  function startOfWeek(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; }
  function toMin(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
  function nowMin(){ const d=new Date(); return d.getHours()*60 + d.getMinutes(); }

  function loadPunch(){ try{ return JSON.parse(localStorage.getItem(PUNCH_KEY) || '{}'); }catch(e){ return {}; } }
  function savePunch(o){ try{ localStorage.setItem(PUNCH_KEY, JSON.stringify(o)); }catch(e){} }

  let toastTimer;
  function toast(msg){
    toastEl.textContent = msg; toastEl.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastEl.hidden = true; }, 2600);
  }

  // souhrn dne z pole píchnutí (otevřená směna se počítá k aktuálnímu času)
  function daySummary(day){
    const arr = (day && day.punches) || [];
    if(!arr.length) return null;
    const plan = (day && day.plan != null) ? day.plan : null;
    let mins = arr.map(p => toMin(p.t));
    for(let i=1;i<mins.length;i++){ while(mins[i] < mins[i-1]) mins[i] += 1440; }
    const kinds = arr.map(p => p.k);
    const open = kinds[kinds.length-1] === 'in';
    const start = mins[0];
    let breaks = 0, paidBreaks = 0;
    for(let i=0;i<arr.length-1;i++){
      if(kinds[i]==='out' && kinds[i+1]==='in'){
        const g = mins[i+1]-mins[i];
        if(arr[i].paid) paidBreaks += g;   // placený paragraf → počítá se jako práce
        else breaks += g;                  // běžné přerušení → odečítá se
      }
    }
    let end;
    if(open){ let n=nowMin(); while(n < mins[mins.length-1]) n += 1440; end = n; }
    else end = mins[mins.length-1];
    const hasOwn = day && day.brk != null;                    // má den vlastní údaj o svačině?
    const snackMin = hasOwn ? day.brk : breakMinutes();        // jinak vezmi aktuální nastavení
    const isPaid   = hasOwn ? !!day.paid : paidEl.checked;
    const snack = isPaid ? 0 : snackMin;                       // neplacená svačina
    const worked = Math.max(0, end - start - breaks - snack);
    const over = plan != null ? worked - plan : null;
    return { start, end: open?null:mins[mins.length-1], worked, breaks, paidBreaks, snack, open, plan, over, punches: arr };
  }

  // klíč aktivní směny (i přes půlnoc); null = žádná aktivní
  function activeShiftKey(store){
    const keys = Object.keys(store).sort();
    if(!keys.length) return null;
    const k = keys[keys.length-1];
    const arr = store[k] && store[k].punches;
    if(!arr || !arr.length) return null;
    let mins = arr.map(p => toMin(p.t));
    for(let i=1;i<mins.length;i++){ while(mins[i] < mins[i-1]) mins[i] += 1440; }
    const lastTs = new Date(k + 'T00:00:00').getTime() + mins[mins.length-1]*60000;
    const gapH = (Date.now() - lastTs) / 3600000;
    if(arr[arr.length-1].k === 'in') return gapH < 18 ? k : null;  // otevřená směna klidně přes půlnoc
    return gapH < 6 ? k : null;                                     // krátká pauza → návrat = přerušení
  }
  function currentKey(store){ return activeShiftKey(store) || ymd(new Date()); }

  function addPunch(kind){
    const store = loadPunch();
    let key = activeShiftKey(store);                 // pokračuj v aktivní směně (i přes půlnoc)
    if(key === null){
      if(kind === 'out'){ toast('Nejsi přihlášen(a)'); return; }
      key = ymd(new Date());                         // nová směna začíná dnes
    }
    const day = store[key] || { punches: [], plan: workMin };
    const arr = day.punches;
    const last = arr[arr.length-1];
    if(kind==='in'  && last && last.k==='in'){ toast('Už jsi přihlášen(a)'); return; }
    if(kind==='out' && (!last || last.k==='out')){ toast('Nejsi přihlášen(a)'); return; }
    const d = new Date();
    arr.push({ t: pad(d.getHours()) + ':' + pad(d.getMinutes()), k: kind });
    day.plan = workMin;                              // plánovaná délka směny
    day.brk  = breakMinutes();                       // délka svačiny (min)
    day.paid = paidEl.checked;                        // placená? → neodečítá se
    store[key] = day; savePunch(store);
    if(kind==='in' && arr.filter(p=>p.k==='in').length===1){   // první příchod = začátek směny
      startEl.value = arr[0].t; calc();
    }
    toast((kind==='in' ? 'Příchod ' : 'Odchod ') + arr[arr.length-1].t + ' zapsáno');
    renderStatus(); renderHistory();
  }

  function renderStatus(){
    const store = loadPunch();
    const s = daySummary(store[currentKey(store)]);
    if(!s){ statusTxt.textContent = 'Dnes nezaznamenáno'; inBtn.disabled=false; outBtn.disabled=true; return; }
    if(s.open){
      const off = s.breaks + s.snack;
      statusTxt.innerHTML = 'V práci od <b>' + hhmm(s.start) + '</b> · odpracováno <b>' + dur(s.worked) + '</b>'
        + (off ? ' · pauza ' + dur(off) : '');
      inBtn.disabled = true; outBtn.disabled = false;
    } else {
      let txt = 'Konec <b>' + hhmm(s.end) + '</b> · odpracováno <b>' + dur(s.worked) + '</b>';
      if(s.over != null) txt += ' · přesčas <b class="' + diffClass(s.over) + '">' + sdur(s.over) + '</b>';
      statusTxt.innerHTML = txt;
      inBtn.disabled = false; outBtn.disabled = true;   // další Příchod = návrat z přerušení
    }
  }

  function fmtDate(k){ return k.slice(8,10) + '.' + k.slice(5,7) + '.'; }

  function renderHistory(){
    if(editArr) renderEdit(); else renderList();
  }

  function renderList(){
    sheetTitle.textContent = 'Historie';
    totalsEl.style.display = '';
    viewActions.hidden = false; editActions.hidden = true;
    addDayBtn.hidden = false;

    const store = loadPunch();
    const keys = Object.keys(store).sort().reverse();
    const now = new Date();
    const wk = startOfWeek(now).getTime();
    let wWork=0,wOver=0,mWork=0,mOver=0;
    const items = keys.map(k => ({ k, s: daySummary(store[k]) })).filter(x => x.s);
    items.forEach(({k,s}) => {
      const d = new Date(k + 'T00:00:00');
      if(d.getTime() >= wk && d.getTime() < wk + 7*86400000){ wWork += s.worked; if(s.over!=null) wOver += s.over; }
      if(d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth()){ mWork += s.worked; if(s.over!=null) mOver += s.over; }
    });
    totalsEl.innerHTML =
      '<div class="tot"><div class="k">Tento týden</div><div class="v">' + dur(wWork) + '</div><div class="sub ' + diffClass(wOver) + '">přesčas ' + sdur(wOver) + '</div></div>' +
      '<div class="tot"><div class="k">Tento měsíc</div><div class="v">' + dur(mWork) + '</div><div class="sub ' + diffClass(mOver) + '">přesčas ' + sdur(mOver) + '</div></div>';

    if(!items.length){ logListEl.innerHTML = '<div class="log-empty">Zatím žádné záznamy.</div>'; return; }
    logListEl.innerHTML = items.map(({k,s}) => {
      const range = hhmm(s.start) + ' → ' + (s.open ? '<span class="live">běží</span>' : hhmm(s.end));
      const off = s.breaks + s.snack;
      const brk = (off ? ' · pauza ' + dur(off) : '') + (s.paidBreaks ? ' · §' + dur(s.paidBreaks) : '');
      const over = s.over != null ? '<span class="df ' + diffClass(s.over) + '">' + sdur(s.over) + '</span>' : '<span class="df zero">–</span>';
      return '<div class="rec"><div><div class="d">' + fmtDate(k) + '  ' + range + '</div>' +
             '<div class="t">odpracováno ' + dur(s.worked) + brk + '</div></div>' +
             '<div class="rec-actions">' + over +
             '<button class="rec-edit" data-date="' + k + '" aria-label="Upravit">✎</button>' +
             '<button class="rec-del" data-date="' + k + '" aria-label="Smazat">✕</button></div></div>';
    }).join('');
  }

  function brkToStr(min){ return pad(Math.floor(min/60)) + ':' + pad(min%60); }

  function renderEdit(){
    sheetTitle.textContent = editDate ? ('Úprava ' + fmtDate(editDate)) : 'Nová směna';
    totalsEl.style.display = 'none';
    viewActions.hidden = true; editActions.hidden = false;
    addDayBtn.hidden = true;
    const rows = editArr.map((p,i) => {
      const isBreakOut = p.k==='out' && editArr[i+1] && editArr[i+1].k==='in';
      return '<div class="edit-row" data-idx="' + i + '">' +
        '<button type="button" class="type-toggle ' + (p.k==='in'?'in':'out') + '" data-idx="' + i + '">' +
          (p.k==='in' ? 'Příchod' : 'Odchod') + '</button>' +
        '<input type="time" class="edit-time" data-idx="' + i + '" value="' + p.t + '">' +
        (isBreakOut ? '<button type="button" class="para-toggle ' + (p.paid?'on':'') + '" data-idx="' + i + '" title="Placený paragraf">§</button>' : '') +
        '<button type="button" class="row-del" data-idx="' + i + '" aria-label="Smazat">✕</button>' +
      '</div>';
    }).join('');
    logListEl.innerHTML =
      '<div class="edit-lbl">Datum</div>' +
      '<input type="date" class="edit-date" value="' + editKey + '">' +
      '<div class="edit-lbl">Svačina</div>' +
      '<div class="edit-brk-row">' +
        '<input type="time" class="edit-brk" value="' + brkToStr(editBrk) + '">' +
        '<button type="button" class="paid-toggle ' + (editPaid?'paid':'unpaid') + '" id="paidToggle">' +
          (editPaid ? 'Placená' : 'Neplacená') + '</button>' +
      '</div>' +
      '<div class="edit-lbl">Píchnutí</div>' +
      '<div class="edit-head">Uprav čas a typ. U přerušení přepni <b>§</b> pro placený paragraf (neodečítá se).</div>' +
      rows +
      '<button type="button" class="act-btn add-punch" id="addPunchBtn">+ Přidat píchnutí</button>';
  }

  function openEdit(date){
    const store = loadPunch();
    const d = store[date] || {};
    editDate = date; editKey = date;
    editArr = (d.punches || []).map(p => ({ t: p.t, k: p.k, paid: p.paid }));
    editBrk = d.brk != null ? d.brk : breakMinutes();
    editPaid = d.brk != null ? !!d.paid : paidEl.checked;
    renderHistory();
  }
  function openNewDay(){
    editDate = null;
    editKey  = ymd(new Date());
    editArr  = [ { t:'08:00', k:'in' }, { t:'16:30', k:'out' } ];
    editBrk  = breakMinutes();
    editPaid = paidEl.checked;
    renderHistory();
  }
  function saveEdit(){
    const store = loadPunch();
    const dateInput = logListEl.querySelector('.edit-date');
    const key = dateInput ? dateInput.value : editKey;
    if(!key){ toast('Vyber datum'); return; }
    const clean = editArr.filter(p => /^\d{1,2}:\d{2}$/.test(p.t));
    const origin = editDate ? store[editDate] : null;
    if(editDate && editDate !== key) delete store[editDate];   // přesun na jiné datum
    if(!clean.length){ delete store[key]; }
    else {
      const existing = store[key] || origin || {};
      store[key] = {
        punches: clean,
        plan: existing.plan != null ? existing.plan : workMin,
        brk: editBrk,
        paid: editPaid
      };
    }
    savePunch(store);
    editDate = editKey = editArr = null;
    renderHistory(); renderStatus();
    toast('Uloženo');
  }
  function cancelEdit(){ editDate = editKey = editArr = null; renderHistory(); }

  function exportCSV(){
    const store = loadPunch();
    const keys = Object.keys(store).sort();
    const rows = keys.map(k => {
      const s = daySummary(store[k]); if(!s) return null;
      const punches = store[k].punches.map(p => p.t + (p.k==='in' ? 'P' : 'O')).join(' ');
      return [k, hhmm(s.start), s.open ? '' : hhmm(s.end), s.worked, s.breaks, s.paidBreaks, s.snack,
              s.plan!=null ? s.plan : '', s.over!=null ? s.over : '', punches];
    }).filter(Boolean);
    if(!rows.length){ toast('Žádné záznamy k exportu'); return; }
    const head = ['Datum','Prichod','Odchod','Odpracovano_min','Preruseni_min','Paragraf_min','Svacina_min','Plan_min','Prescas_min','Pichnuti'];
    const csv = '\uFEFF' + [head].concat(rows).map(r => r.join(';')).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'pichacky.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  inBtn.addEventListener('click',  () => addPunch('in'));
  outBtn.addEventListener('click', () => addPunch('out'));
  histBtn.addEventListener('click', () => { editDate=editKey=editArr=null; renderHistory(); histEl.hidden = false; });
  histClose.addEventListener('click', () => { editDate=editKey=editArr=null; histEl.hidden = true; });
  histEl.addEventListener('click', e => { if(e.target === histEl){ editDate=editKey=editArr=null; histEl.hidden = true; } });
  addDayBtn.addEventListener('click', openNewDay);
  csvBtn.addEventListener('click', exportCSV);
  clearBtn.addEventListener('click', () => { if(confirm('Opravdu vymazat všechny záznamy?')){ savePunch({}); renderStatus(); renderHistory(); } });
  saveEditBtn.addEventListener('click', saveEdit);
  cancelEditBtn.addEventListener('click', cancelEdit);

  logListEl.addEventListener('click', e => {
    const editB = e.target.closest('.rec-edit'); if(editB){ openEdit(editB.dataset.date); return; }
    const delB  = e.target.closest('.rec-del');
    if(delB){ const store=loadPunch(); delete store[delB.dataset.date]; savePunch(store); renderStatus(); renderHistory(); return; }
    const tt = e.target.closest('.type-toggle');
    if(tt){ const i=+tt.dataset.idx; editArr[i].k = editArr[i].k==='in' ? 'out' : 'in'; renderEdit(); return; }
    const rd = e.target.closest('.row-del');
    if(rd){ editArr.splice(+rd.dataset.idx, 1); renderEdit(); return; }
    if(e.target.closest('.add-punch')){
      const last = editArr[editArr.length-1];
      editArr.push({ t: last ? last.t : nowHHMM(), k: last ? (last.k==='in'?'out':'in') : 'in' });
      renderEdit(); return;
    }
    if(e.target.closest('#paidToggle')){ editPaid = !editPaid; renderEdit(); return; }
    const pt = e.target.closest('.para-toggle');
    if(pt){ const i=+pt.dataset.idx; editArr[i].paid = !editArr[i].paid; renderEdit(); return; }
  });
  logListEl.addEventListener('input', e => {
    const inp = e.target.closest('.edit-time');
    if(inp && editArr){ editArr[+inp.dataset.idx].t = inp.value; return; }
    const dt = e.target.closest('.edit-date');
    if(dt){ editKey = dt.value; return; }
    const bk = e.target.closest('.edit-brk');
    if(bk){ const [h,m]=(bk.value||'0:0').split(':').map(Number); editBrk = (h||0)*60 + (m||0); }
  });

  // ===== parametry v URL (pro NFC tag) =====
  // ?prichod → píchni příchod     ?odchod → píchni odchod
  startEl.addEventListener('input', () => { calc(); });
  brkInput.addEventListener('input', () => { saveSettings(); calc(); });
  paidEl.addEventListener('change', () => { saveSettings(); calc(); });

  loadSettings();
  syncStartFromShift();
  syncSeg();
  calc();
  const params = new URLSearchParams(location.search);
  if(params.has('prichod')) addPunch('in');
  if(params.has('odchod'))  addPunch('out');
  if((params.has('prichod') || params.has('odchod')) && history.replaceState){
    history.replaceState(null, '', location.pathname);   // vyčisti URL
  }
  renderStatus();
  renderHistory();
  setInterval(() => { updateNow(); renderStatus(); }, 1000);   // živá aktualizace

  // offline režim (PWA)
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
