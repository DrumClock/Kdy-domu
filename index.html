    if(editType === 'dovolena' || editType === 'nemoc'){
      html += '<div class="edit-lbl">Datum do</div>' +
              '<input type="date" class="edit-date-to" value="' + (editKeyTo || editKey) + '">' +
              '<div class="edit-head">Zapíše se za celé období od–do (soboty a neděle se přeskočí). Nepočítá se do odpracováno ani přesčasu.</div>';
    } else if(editType === 'paragraf' || editType === 'svatek'){
      html += '<div class="edit-head">Celý den se nepočítá do odpracováno ani přesčasu.</div>';
    } else if(editType === 'nahradni'){
      html += '<div class="edit-lbl">Délka (dle směny)</div>' +
              '<div class="plan-row">' + plansHtml() + '</div>' +
              '<div class="edit-head">Náhradní volno se přičte do odpracováno a odečte z přesčasu.</div>';
    } else if(editType === 'pulden'){
      const opts = sel => Object.keys(HALF_LABELS).map(k =>
        '<option value="' + k + '"' + (sel===k?' selected':'') + '>' + HALF_LABELS[k] + '</option>').join('');
      const plan = editPlan, half = Math.round(plan/2);
      const st = (editPulStart && editPulStart.indexOf(':') > 0) ? editPulStart : '08:00';
      const mid = hhmm(toMin(st) + half), endT = hhmm(toMin(st) + plan);
      html += '<div class="edit-lbl">Pracovní doba</div>' +
              '<div class="plan-row">' + plansHtml() + '</div>' +
              '<div class="edit-lbl">Začátek</div>' +
              '<input type="time" class="edit-pulstart" value="' + st + '">' +
              '<div class="edit-lbl">První půlka</div>' +
              '<select class="edit-half" id="halfA">' + opts(editHalfA) + '</select>' +
              '<div class="edit-lbl">Druhá půlka</div>' +
              '<select class="edit-half" id="halfB">' + opts(editHalfB) + '</select>' +
              '<div class="edit-head">' + st + ' → ' + mid + ' <b>' + HALF_LABELS[editHalfA] + '</b> · ' +
                mid + ' → ' + endT + ' <b>' + HALF_LABELS[editHalfB] + '</b></div>';
    } else {   // směna
      html += '<div class="edit-lbl">Pracovní doba</div>' +
              '<div class="plan-row">' + plansHtml() + '</div>' +
              '<div class="edit-lbl">Svačina</div>' +
              '<div class="edit-brk-row">' +
                '<input type="time" class="edit-brk" value="' + brkToStr(editBrk) + '">' +
                '<button type="button" class="paid-toggle ' + (editPaid?'paid':'unpaid') + '" id="paidToggle">' +
                  (editPaid ? 'Placená' : 'Neplacená') + '</button>' +
              '</div>' +
              '<div class="edit-lbl">Píchnutí</div>' +
              '<div class="edit-head">Zadej <b>Příchod/Odchod</b> odpracované doby. Když nedosáhneš plné směny, vyber dole <b>Zbytek do plné směny</b> — schodek se dopočítá sám.</div>' +
              punchRowsHtml() +
              '<button type="button" class="act-btn add-punch" id="addPunchBtn">+ Přidat píchnutí</button>' +
              '<label class="svatek-row"><input type="checkbox" id="holToggle"' + (editHoliday?' checked':'') + '> Práce ve svátek (do odpracováno, ne do přesčasu)</label>' +
              fillPickerHtml();
    }
    logListEl.innerHTML = html;
  }

  function openEdit(date){
    const store = loadPunch();
    const d = store[date] || {};
    editDate = date; editKey = date; editKeyTo = date;
    editType = d.type || 'smena';
    editArr = (d.punches || []).map(p => ({ t: p.t, k: p.k }));
    editFill = d.fill || '';
    if(!editFill){                                   // migrace ze starých značek/úseků
      const outs = (d.punches || []).filter(p => p.k === 'out');
      const seg = outs.map(p => p.seg).find(s => s && s !== 'prace');
      const fl = outs.find(p => p.paid || p.nv || p.dov);
      if(seg) editFill = seg;
      else if(fl) editFill = fl.paid ? 'paragraf' : fl.nv ? 'nahradni' : 'dovolena';
    }
    if(!editArr.length && editType === 'smena') editArr = [ { t:'08:00', k:'in' }, { t:'16:30', k:'out' } ];
    editBrk = d.brk != null ? d.brk : breakMinutes();
    editPaid = d.brk != null ? !!d.paid : paidEl.checked;
    editHoliday = !!d.holiday;
    editPlan = d.plan != null ? d.plan : workMin;
    editPulStart = d.start || '08:00';
    editHalfA = d.a || 'prace';
    editHalfB = d.b || 'dovolena';
    renderHistory();
  }
  function openNewDay(){
    editDate = null;
    editKey  = ymd(new Date()); editKeyTo = editKey;
    editType = 'smena';
    editArr  = [ { t:'08:00', k:'in' }, { t:'16:30', k:'out' } ];
    editBrk  = breakMinutes();
    editPaid = paidEl.checked; editHoliday = false;
    editPlan = workMin;
    editPulStart = '08:00'; editHalfA = 'prace'; editHalfB = 'dovolena'; editFill = '';
    renderHistory();
  }
  function saveEdit(){
    const store = loadPunch();
    const dateInput = logListEl.querySelector('.edit-date');
    const key = dateInput ? dateInput.value : editKey;
    if(!key){ toast('Vyber datum'); return; }
    if(editDate && editDate !== key) delete store[editDate];   // přesun na jiné datum

    if(editType === 'dovolena' || editType === 'nemoc'){
      const toInput = logListEl.querySelector('.edit-date-to');
      let a = key, b = (toInput && toInput.value) ? toInput.value : key;
      if(b < a){ const t=a; a=b; b=t; }
      let d = new Date(a + 'T00:00:00'); const end = new Date(b + 'T00:00:00');
      let n = 0;
      while(d <= end && n < 400){
        const wd = d.getDay();
        if(wd !== 0 && wd !== 6) store[ymd(d)] = { type: editType };   // přeskoč So (6) a Ne (0)
        d.setDate(d.getDate()+1); n++;
      }
      savePunch(store);
      editDate = editKey = editKeyTo = editArr = null; editType = 'smena'; editFill = '';
      renderHistory(); renderStatus(); toast('Uloženo'); return;
    }
    if(editType === 'paragraf' || editType === 'svatek'){
      store[key] = { type: editType };
    } else if(editType === 'nahradni'){
      store[key] = { type: 'nahradni', plan: editPlan };
    } else if(editType === 'pulden'){
      store[key] = { type: 'pulden', start: editPulStart, plan: editPlan, a: editHalfA, b: editHalfB };
    } else {   // směna
      const clean = editArr.filter(p => /^\d{1,2}:\d{2}$/.test(p.t)).map(p => ({ t: p.t, k: p.k }));
      if(!clean.length){ delete store[key]; }
      else {
        const rec = { punches: clean, plan: editPlan, brk: editBrk, paid: editPaid };
        if(editHoliday) rec.holiday = true;
        if(editFill) rec.fill = editFill;
        store[key] = rec;
      }
    }
    savePunch(store);
    editDate = editKey = editKeyTo = editArr = null; editType = 'smena'; editFill = '';
    renderHistory(); renderStatus(); toast('Uloženo');
  }
  function cancelEdit(){ editDate = editKey = editArr = null; renderHistory(); }

  inBtn.addEventListener('click',  () => addPunch('in'));
  outBtn.addEventListener('click', () => addPunch('out'));

  function markLabel(t){ return t === 'nemoc' ? 'Nemoc' : 'Paragraf'; }
  function setDayType(type){
    const store = loadPunch();
    const key = ymd(new Date());
    const cur = store[key];
    if(cur && cur.type === type){                    // už je → zrušit (přepínač)
      delete store[key]; savePunch(store);
      toast(markLabel(type) + ' zrušeno'); renderStatus(); renderHistory(); return;
    }
    const apply = () => {
      const s2 = loadPunch(); s2[key] = { type }; savePunch(s2);
      toast(markLabel(type) + ' zapsáno'); renderStatus(); renderHistory();
    };
    if(cur && cur.punches && cur.punches.length){
      askConfirm('Dnes je zaznamenaná směna. Přepsat na ' + markLabel(type) + '?', 'Přepsat')
        .then(ok => { if(ok) apply(); });
    } else { apply(); }
  }
  histBtn.addEventListener('click', () => { editDate=editKey=editArr=null; histMonth=null; renderHistory(); histEl.hidden = false; });
  histClose.addEventListener('click', () => { editDate=editKey=editArr=null; histEl.hidden = true; });

  // otevři historii, když se sem přišlo swipem z nápovědy
  if(new URLSearchParams(location.search).get('open') === 'historie'){
    editDate=editKey=editArr=null; histMonth=null; renderHistory(); histEl.hidden = false;
  }

  // --- swipe: přepíná Hlavní ↔ Historie ---
  (function(){
    const MIN_DX = 45;    // min. vodorovná vzdálenost (px) — nižší = citlivější
    const RATIO  = 1.15;  // kolikrát musí být vodorovné > svislé — nižší = tolerantnější
    const openHist  = () => { editDate=editKey=editArr=null; histMonth=null; renderHistory(); histEl.hidden = false; };
    const closeHist = () => { editDate=editKey=editArr=null; histEl.hidden = true; };
    const noStart = el => el && el.closest && el.closest('input[type=text],input[type=number],textarea,[contenteditable]');
    let sx=0, sy=0, on=false, swiped=false;
    document.addEventListener('touchstart', e => {
      if(e.touches.length !== 1){ on=false; return; }
      const t = e.touches[0];
      if(t.clientX < 22 || t.clientX > window.innerWidth - 22){ on=false; return; }   // hrana = systémové zpět
      if(noStart(e.target)){ on=false; return; }
      sx=t.clientX; sy=t.clientY; on=true; swiped=false;
    }, {passive:true});
    document.addEventListener('touchend', e => {
      if(!on){ return; } on=false;
      const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
      if(Math.abs(dx) < MIN_DX || Math.abs(dx) < Math.abs(dy)*RATIO) return;   // hlavně vodorovné
      if(!histEl.hidden && (editDate || editKey)) return;                       // otevřená editace dne → nepřepínej
      swiped = true; setTimeout(()=>{ swiped=false; }, 500);                    // potlač následný klik
      if(histEl.hidden) openHist(); else closeHist();                           // libovolný směr = přepnutí
    }, {passive:true});
    document.addEventListener('click', e => {
      if(swiped){ e.preventDefault(); e.stopPropagation(); swiped=false; }
    }, true);
  })();
  histEl.addEventListener('click', e => { if(e.target === histEl){ editDate=editKey=editArr=null; histEl.hidden = true; } });
  addDayBtn.addEventListener('click', openNewDay);
  clearBtn.addEventListener('click', () => {
    const now = new Date();
    const { y, m } = histMonth || { y: now.getFullYear(), m: now.getMonth() };
    askConfirm('Vymazat všechny záznamy za ' + monthLabel(y,m) + '?', 'Vymazat').then(ok => {
      if(!ok) return;
      const store = loadPunch();
      Object.keys(store).forEach(k => { const d=new Date(k+'T00:00:00'); if(d.getFullYear()===y && d.getMonth()===m) delete store[k]; });
      savePunch(store); renderStatus(); renderHistory();
    });
  });
  saveEditBtn.addEventListener('click', saveEdit);
  cancelEditBtn.addEventListener('click', cancelEdit);

  totalsEl.addEventListener('click', e => {
    const b = e.target.closest('.mnav'); if(!b || b.disabled) return;
    const now = new Date();
    const { y, m } = histMonth || { y: now.getFullYear(), m: now.getMonth() };
    const store = loadPunch();
    const curRealKey = now.getFullYear() + '-' + pad(now.getMonth()+1);
    const reach = [...new Set([...Object.keys(store).map(k => k.slice(0,7)), curRealKey])].sort();
    const curKey = y + '-' + pad(m+1);
    let target;
    if((+b.dataset.dir) < 0) target = reach.filter(mm => mm < curKey).pop();   // nejbližší dřívější se záznamem
    else target = reach.find(mm => mm > curKey);                              // nejbližší pozdější se záznamem
    if(!target) return;
    const [ty, tm] = target.split('-');
    histMonth = { y: +ty, m: +tm - 1 };
    renderList();
  });
  // počáteční stavy se zadávají na samostatné stránce stavy.html

  logListEl.addEventListener('click', e => {
    const editB = e.target.closest('.rec-edit'); if(editB){ openEdit(editB.dataset.date); return; }
    const delB  = e.target.closest('.rec-del');
    if(delB){
      const date = delB.dataset.date;
      askConfirm('Smazat záznam ' + fmtDate(date) + '?').then(ok => {
        if(!ok) return;
        const store=loadPunch(); delete store[date]; savePunch(store); renderStatus(); renderHistory();
      });
      return;
    }
    const tt = e.target.closest('.type-toggle');
    if(tt){ const i=+tt.dataset.idx; editArr[i].k = editArr[i].k==='in' ? 'out' : 'in'; renderEdit(); return; }
    const rd = e.target.closest('.row-del');
    if(rd){ editArr.splice(+rd.dataset.idx, 1); renderEdit(); return; }
    if(e.target.closest('.add-punch')){
      const last = editArr[editArr.length-1];
      editArr.push({ t: last ? last.t : nowHHMM(), k: last ? (last.k==='in'?'out':'in') : 'in' });
      renderEdit(); return;
    }
    if(e.target.closest('#paidToggle')){ editPaid = !editPaid; renderEdit(); return; }
    if(e.target.closest('#holToggle')){ editHoliday = !editHoliday; renderEdit(); return; }
    const plb = e.target.closest('.plan-btn');
    if(plb){ editPlan = +plb.dataset.plan; renderEdit(); return; }
    const topt = e.target.closest('.type-opt');
    if(topt){ editType = topt.dataset.type; renderEdit(); return; }
    const sb = e.target.closest('.seg-btn');
    if(sb){ const i=+sb.dataset.idx, t=sb.dataset.seg;
      editArr[i].seg = (editArr[i].seg === t) ? 'prace' : t; renderEdit(); return; }
    const fb = e.target.closest('.fill-btn');
    if(fb){ editFill = fb.dataset.fill; renderEdit(); return; }
  });
  logListEl.addEventListener('input', e => {
    const inp = e.target.closest('.edit-time');
    if(inp && editArr){ editArr[+inp.dataset.idx].t = inp.value; return; }
    const dt = e.target.closest('.edit-date');
    if(dt){ editKey = dt.value; return; }
    const dto = e.target.closest('.edit-date-to');
    if(dto){ editKeyTo = dto.value; return; }
    const bk = e.target.closest('.edit-brk');
    if(bk){ const [h,m]=(bk.value||'0:0').split(':').map(Number); editBrk = (h||0)*60 + (m||0); return; }
    const ps = e.target.closest('.edit-pulstart');
    if(ps){ editPulStart = ps.value; renderEdit(); return; }
    const hf = e.target.closest('.edit-half');
    if(hf){ if(hf.id==='halfA') editHalfA = hf.value; else editHalfB = hf.value; renderEdit(); return; }
  });

  // ===== parametry v URL (pro NFC tag) =====
  // ?prichod → píchni příchod     ?odchod → píchni odchod
  startEl.addEventListener('input', () => { calc(); });
  brkInput.addEventListener('input', () => { saveSettings(); calc(); });
  paidEl.addEventListener('change', () => { saveSettings(); calc(); });

  loadSettings();
  syncStartFromShift();
  syncSeg();
  calc();
  const params = new URLSearchParams(location.search);
  if(params.has('prichod')) addPunch('in');
  if(params.has('odchod'))  addPunch('out');
  if((params.has('prichod') || params.has('odchod')) && history.replaceState){
    history.replaceState(null, '', location.pathname);   // vyčisti URL
  }
  renderStatus();
  renderHistory();
  setInterval(() => { updateNow(); renderStatus(); }, 1000);   // živá aktualizace

  // offline režim (PWA)
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
